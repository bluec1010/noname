<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3b63">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>数测背诵清单</title>
<style>
:root{--bg:#fbfbfd;--fg:#1b1b1f;--muted:#6b7280;--line:#e5e7eb;--card:#fff;
--accent:#1f3b63;--ok:#2e7d32;--bu:#b03030;--hl:#eef4ff;
--book:#2e7d32;--kwbg:rgba(255,193,7,.24);--kwfg:#8a6100}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--fg:#e6e8ee;--muted:#9aa3b2;
--line:#262b36;--card:#171a21;--accent:#8fb4e6;--ok:#7bd88f;--bu:#ff8a80;--hl:#1b2436;
--book:#7bd88f;--kwbg:rgba(255,193,7,.16);--kwfg:#f0c674}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
padding-bottom:72px}
header{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);
padding:10px 12px 12px}
.hrow{display:flex;align-items:center;gap:8px}
.hrow button{width:44px;height:44px;flex:0 0 44px;border:1px solid var(--line);background:var(--card);
color:var(--fg);border-radius:12px;font-size:20px;line-height:1}
.hmain{flex:1;text-align:center;min-width:0}
.hdate{font-size:13px;color:var(--muted)}
.hday{font-size:17px;font-weight:700;color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .2s}
.hsub{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.hsub button{border:0;background:none;color:var(--accent);font-size:12px;padding:4px 0}
.hint{display:none;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--hl);
color:var(--accent);font-size:12px;line-height:1.5}
.hint.on{display:block}
main{padding:12px}
h2{font-size:15px;margin:18px 4px 8px;color:var(--muted);font-weight:600}
h2:first-child{margin-top:4px}
.item{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;
padding:10px 12px;margin-bottom:8px}
.item.on{border-color:var(--ok);background:var(--hl)}
.chk{flex:0 0 26px;width:26px;height:26px;margin-top:3px;padding:0;border:2px solid var(--line);
background:transparent;border-radius:50%;cursor:pointer}
.item.on .chk{border-color:var(--ok);background:var(--ok)}
.item.on .chk::after{content:"";display:block;width:6px;height:11px;margin:1px 0 0 7px;
border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.bd{flex:1;min-width:0;cursor:pointer}
.nm{font-weight:600;font-size:17px}
.nm .bu{font-style:normal;font-size:11px;color:#fff;background:var(--bu);border-radius:5px;
padding:1px 5px;margin-left:6px;vertical-align:2px}
.det{margin-top:8px}
.det p{margin:7px 0;font-size:14px;line-height:1.65}
.det .lb{display:inline-block;min-width:4.6em;color:var(--muted);font-size:12px;font-weight:400}
.det .p-book{font-weight:700;border-left:3px solid var(--book);padding-left:9px}
.det .p-kw .kwbox{display:inline-block;background:var(--kwbg);color:var(--kwfg);border-radius:7px;
padding:2px 9px;font-size:13.5px;font-weight:600;letter-spacing:.2px}
.det .nt{color:var(--muted);border-left:2px solid var(--line);padding-left:8px}
.item .det{display:none}
.item.open .det{display:block}
.item.kwonly .p-human,.item.kwonly .p-book,.item.kwonly .nt{display:none}
.acts{display:flex;flex-direction:column;gap:6px;padding-top:1px}
.acts button{width:34px;height:26px;padding:0;font-size:11px;line-height:1;border-radius:8px;
border:1px solid var(--line);background:transparent;color:var(--muted)}
.acts button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.miss{color:var(--muted);font-size:13px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:20px 12px 10px;line-height:1.7}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;
background:var(--card);color:var(--fg);font-size:16px;margin-bottom:12px}
.chap{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.chap>summary{padding:12px 14px;font-weight:600;cursor:pointer;list-style:none}
.chap>summary::-webkit-details-marker{display:none}
.chap>summary::after{content:"›";float:right;color:var(--muted);transform:rotate(90deg)}
.chap[open]>summary::after{transform:rotate(-90deg)}
.chap>div{padding:0 14px 10px}
.li{padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.li .kw{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.li.hide{display:none}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
tr.today td{background:var(--hl);font-weight:600}
tr[data-d]{cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);
border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 0;border:0;background:none;color:var(--muted);font-size:14px}
nav button.on{color:var(--accent);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <button id="prev" aria-label="前一天">‹</button>
    <div class="hmain">
      <div class="hday" id="hDay">—</div>
      <div class="hdate" id="hDate">—</div>
    </div>
    <button id="next" aria-label="后一天">›</button>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="hsub"><span id="hProg">0 / 0</span><button id="goToday">回到今天</button></div>
  <div class="hint" id="hint"></div>
</header>
<main id="view"></main>
<div class="foot" id="foot"></div>
<nav>
  <button data-tab="today" class="on">今日</button>
  <button data-tab="list">清单</button>
  <button data-tab="sched">排期</button>
</nav>
<script>const DATA={"meta":{"base":"2026-09-26","total":231,"goal":231,"doneAll":1,"days":38},"chapters":[{"name":"第1章 测绘学总论","items":[{"n":"测量学","h":"搞清楚「地面上的东西在哪、长什么样」，并把它画成地图的学问。","b":"确定地面点的几何位置、地球形状与重力场，测量地物地貌的分布，绘制各种比例尺地图和专题图。","k":"位置、形状、地图","bu":0,"note":""},{"n":"大地测量学","h":"专门测「地球这个大球」本身——多大多扁、重力场、点位变化。","b":"确定地球形状、大小、重力场、整体与局部运动、地表点几何位置及其变化；分几何、物理、空间大地测量。","k":"地球形状、大小、重力场、点位","bu":0,"note":""},{"n":"摄影测量学","h":"不站到跟前，用照片/影像反推出物体的形状、大小、位置。","b":"研究影像与被摄物体间的几何、物理关系，经处理解译，确定物体形状、大小、空间位置和性质。","k":"影像、反推、形状位置","bu":0,"note":""},{"n":"地图学","h":"研究怎么把测得的东西画成好用、好看的地图。","b":"研究模拟/数字地图的理论、设计、编绘、复制及应用；分理论、制图方法、地图应用。","k":"地图、设计、编绘","bu":0,"note":""},{"n":"工程测量学","h":"盖楼、修路、建桥、开矿时，全程量尺寸、放样、盯变形。","b":"在规划、勘察、设计、施工、运营各阶段，进行控制测量、大比例尺地形测绘、变形监测及分析预报。","k":"工程、施工、放样、变形监测","bu":0,"note":""},{"n":"海洋测绘学","h":"把「测」搬到海上——测海面、海底、海道，画海图。","b":"以海洋水体和海底为对象；含海洋大地测量、海道测量、海底地形测量、海图编绘。","k":"海洋、海底、海图","bu":0,"note":""},{"n":"传统测图 vs 数字化测图","h":"传统＝人量完手画（图解法）；数字化＝量完喂电脑、人机一起成图。","b":"传统实质是图解法测图；数字化实质是全解析机测图，具高自动化、全数字化、高精度特点。","k":"图解（人工手画）vs 全解析（计算机成图）","bu":0,"note":""},{"n":"广义数字化测图","h":"不管数据从哪来（野外测、扫老图、航拍遥感），最后都传进电脑、用成图软件做出数字地形图的总称。","b":"利用全站仪等野外测图、纸质地图数字化、航摄/遥感像片测图，把数据传到计算机经成图软件处理得到数字地形图。","k":"野外+扫图+航摄、传电脑、成图软件","bu":1,"note":""},{"n":"数字测图三分类","h":"数字图三条来源——地面测、纸图扫、影像做。","b":"①地面数字测图（全站仪野外采集）②地图数字化（扫描/手扶跟踪仪把纸图数字化）③数字摄影测量（影像数字化处理）。","k":"地面测、纸图扫、影像做","bu":0,"note":""},{"n":"遥感","h":"不接触目标，隔老远收它反射/发出的电磁波，分析出它是什么。","b":"非接触式远距离探测技术；传感器收集目标反射/辐射的电磁波，处理后识别地物特征和状态。","k":"非接触、电磁波、识别","bu":0,"note":""},{"n":"微波遥感","h":"用微波（雷达类波）「看」远处，能穿云雾。","b":"利用微波对远距离目标进行探测、成像和测量。","k":"微波、雷达、成像","bu":0,"note":""},{"n":"空间关系","h":"物体在三维空间里的相对位置、方向、距离。","b":"物体在三维空间中相对位置、方向、距离等属性的相互联系。","k":"位置、方向、距离","bu":0,"note":""},{"n":"空间信息可视化","h":"把带位置的信息变成图、图像，让人用眼睛看、交互、分析。","b":"将含有空间位置的信息转化为图形、图像，利用视觉感知进行展示、交互和分析。","k":"空间信息→图形图像、视觉、展示交互分析","bu":1,"note":""},{"n":"GIS（地理信息系统）","h":"一个「存地图 + 能分析地图」的电脑系统，帮人做空间决策。","b":"以地理空间数据为基础，采用地理模型分析方法，提供空间和动态地理信息；由硬件、软件、数据、人员、方法组成。","k":"空间数据、存/分析/展示、决策","bu":0,"note":""},{"n":"网络GIS","h":"把 GIS 搬上网，在线采集、共享、分析。","b":"基于互联网技术实现地理信息采集、存储、管理、分析与共享。","k":"互联网、共享","bu":0,"note":""},{"n":"城市基础地理信息系统","h":"GIS 在城市里的应用系统，是城市各管理系统打底的「底图」。","b":"由基础地理信息子系统和若干专题信息子系统组成，是城市各管理系统的基础。","k":"基础+专题子系统、城市管理基础","bu":1,"note":""}]},{"name":"第2章 坐标系与高程基准","items":[{"n":"铅垂线 / 水准面","h":"铅垂线＝重力的作用线（东西自由下落的方向）；水准面＝静止水面形成的面，处处与重力方向垂直。","b":"铅垂线是重力的作用线；水准面是处于静止平衡状态的液体表面，是一个重力等位面。","k":"重力方向、静止水面、等位面","bu":0,"note":""},{"n":"平均海水面","h":"把海水涨落平均一下得到的那个水平面，用它来代替地球表面、当高程起算基准。","b":"一个最接近于地球表面、用来代替地球表面的水准面。","k":"海水平均、代替地球表面、高程基准","bu":0,"note":""},{"n":"大地水准面","h":"把「平均海水面」往陆地里延伸、包住整个地球的那个封闭曲面。","b":"处于静止平衡状态的平均海水面向陆地内部延伸所形成的封闭曲面。","k":"平均海水面延伸、封闭曲面、高程起算面","bu":0,"note":""},{"n":"似大地水准面","h":"比「大地水准面」更实用的一种面——从地面点沿「正常重力线」量出正常高，这些端点连成的封闭曲面。","b":"从地面点沿正常重力线量取正常高所得端点构成的封闭曲面。","k":"正常重力线、正常高、封闭曲面","bu":0,"note":""},{"n":"大地体","h":"大地水准面（那个海平面延伸的封闭曲面）包住的整个「球体」。","b":"大地水准面包围的形体。","k":"大地水准面包围的形体","bu":1,"note":""},{"n":"地球椭球 / 参考椭球","h":"地球椭球＝拿一个椭圆绕短轴转一圈得到的「标准地球模型」；参考椭球＝形状、大小、位置都定死了、用来当地球基准的那个椭球。","b":"地球椭球是一个椭圆绕短轴旋转形成的旋转椭球体；参考椭球是形状、大小、位置都确定的地球椭球体。","k":"椭圆旋转、形状大小位置确定、地球基准","bu":0,"note":""},{"n":"地球总椭球","h":"和真实地球「最贴合」的那个椭球（全球通用的最佳椭球）。","b":"满足地心定位和双平行条件，具有全球几何物理参数，与地球形状大小最密合，短轴与地球自转轴重合。","k":"地心定位、全球参数、最密合","bu":1,"note":"【地心定位】椭球中心与地球质心（地心）重合。【双平行条件】①椭球短轴∥地球自转轴②起始子午面∥格林尼治天文子午面。【对比】总椭球对全球（WGS-84、2000），参考椭球对局部（1954、1980）。"},{"n":"参考椭球定位","h":"把参考椭球「摆放」到和本地区大地水准面最贴合的位置。","b":"使参考椭球面与大地水准面最为吻合；使椭球中心与大地体中心重合，选大地原点使该点椭球面与大地水准面重合。","k":"最吻合、中心重合、大地原点","bu":0,"note":"【坐标原点vs大地原点】坐标原点＝椭球中心的数学零点（虚，摸不着）；大地原点＝地面实埋标石（实，如西安泾阳）。参考椭球定位靠「大地原点」把椭球钉到地面，算坐标时用「坐标原点（椭球中心）」。"},{"n":"参考椭球面","h":"参考椭球体的表面。","b":"参考椭球体的表面。","k":"参考椭球体的表面","bu":1,"note":""},{"n":"扁率公式","h":"描述地球「有多扁」的公式。","b":"扁率 f=(a-b)/a（a 长半轴、b 短半轴）；地球平均半径 R=(a+a+b)/3=6371km。","k":"f=(a-b)/a、长半轴a短半轴b、R=6371km","bu":0,"note":""},{"n":"赤道面 / 赤道","h":"赤道面＝赤道所在的平面；赤道＝这个面和参考椭球面的交线（那个大圆圈）。","b":"赤道面是赤道所在的平面；赤道是大地赤道面与参考椭球面的交线。","k":"赤道所在平面、与椭球面交线","bu":1,"note":""},{"n":"大地坐标（L, B, H）","h":"用「经度 L、纬度 B、大地高 H」三个数给地面点定位。","b":"以参考椭球面为基准面、法线为基准线；L=子午面与初始子午面夹角；B=法线与赤道面夹角；H=沿法线到参考椭球面距离。","k":"经度L、纬度B、大地高H、参考椭球面","bu":0,"note":""},{"n":"正高 / 正常高","h":"正高＝沿铅垂线到「大地水准面」的距离；正常高＝沿（正常）重力线到「似大地水准面」的距离。","b":"正高＝地面点沿铅垂线到大地水准面的距离；正常高＝地面点沿铅垂线到似大地水准面的距离。","k":"正高→大地水准面、正常高→似大地水准面","bu":0,"note":""},{"n":"大地水准面差距 / 高程异常","h":"都是「水准面到参考椭球面」的差距，区别在哪个水准面。","b":"大地水准面差距＝大地水准面到参考椭球面的距离（正高+差距=H）；高程异常＝似大地水准面到参考椭球面的距离（正常高+异常=H）。","k":"正高+差距=H、正常高+异常=H","bu":0,"note":""},{"n":"空间直角坐标","h":"以地球中心为原点，用 x、y、z 三个互相垂直的轴定位。","b":"以椭球体中心O为原点，起始子午面与赤道面交线为x轴，赤道面正交方向为y轴，旋转轴为z轴，右手系O-xyz。","k":"椭球中心为原点、xyz右手系","bu":0,"note":""},{"n":"平面直角坐标系（三分类）","h":"把地面点放到平面上表示用的三种直角坐标——高斯平面、独立、建筑施工。","b":"工程测量中 x 轴表南北、y 轴表东西、象限顺时针；含①高斯平面直角坐标系②独立平面直角坐标系③建筑施工坐标系。","k":"三种、x南北y东西、象限顺时针","bu":1,"note":""},{"n":"独立平面直角坐标系","h":"测区很小时，把球面当平面，自己建一套直角坐标。","b":"测区较小时将球面看做平面，建立独立平面直角坐标系，地面点用平面坐标表示。","k":"测区小、球面当平面","bu":1,"note":""},{"n":"建筑施工坐标系","h":"为方便施工放样，让坐标轴和建筑的轴线对齐。","b":"使坐标轴与主体建筑的轴线重合、平行、垂直，方便计算和放样。","k":"坐标轴对齐建筑轴线、放样","bu":1,"note":""},{"n":"1954北京坐标系","h":"我国第一个全国坐标系，用克拉索夫斯基椭球，大地原点在苏联。","b":"采用克拉索夫斯基椭球参数，与苏联1942坐标系联测；参心坐标系，大地原点在苏联普尔科沃。","k":"克拉索夫斯基椭球、参心、原点苏联","bu":1,"note":""},{"n":"1980国家坐标系","h":"我国第二代坐标系，大地原点在陕西西安。","b":"1972~1982天文大地网平差时建立；参心坐标系，大地原点在陕西西安。","k":"参心、原点陕西西安","bu":1,"note":""},{"n":"2000国家/WGS-84坐标系","h":"现在我国用的地心坐标系（和 GPS 的 WGS-84 一个套路），原点在地球质心。","b":"地心坐标系，原点为地球质心，z轴指向协议地极（BIH1984.0），x轴指向零子午线与协议地极赤道面交点，y轴由右手系确定。","k":"地心坐标系、原点=地球质心、与WGS-84一致","bu":1,"note":"【地心vs参心】地心坐标系＝原点在地球质心，椭球贴合全球，适合全球用（WGS-84、2000国家）；参心坐标系＝原点在参考椭球中心（不在地心），只贴合本国大地水准面，适合局部用（1954北京、1980西安）。"},{"n":"地图投影","h":"把地球曲面上的东西，按数学规则「摊平」到平面上的方法。","b":"将曲面上的各元素按照一定的数学法则投影到平面上。","k":"曲面→平面、数学法则","bu":1,"note":""},{"n":"投影变形","h":"曲面投影到平面后，角度、距离、图形和原来相比出现的差异。","b":"将曲面上一个角度、一段距离、一个图形投影到平面上和原来相比出现的差异。","k":"角度/距离/图形变形","bu":1,"note":""},{"n":"地图投影分类","h":"三种分法——按投影面（圆柱/圆锥/方位）、按位置（正轴/横轴/斜轴）、按变形（等角/等面积/任意）。","b":"按投影面分圆柱、圆锥、方位投影；按相对位置分正轴、横轴、斜轴；按变形方式分等角、等面积、任意投影。","k":"三类三法","bu":1,"note":""},{"n":"距离改化 / 方向改化","h":"距离改化＝把地面水平距离归算到高斯平面；方向改化＝把大地线方向化成高斯平面的坐标方位角。","b":"距离改化＝地面水平距离归算到高斯平面的改正；方向改化＝椭球面大地线方向化为高斯平面坐标方位角所加的改正数。","k":"距离归算、方向归算、高斯平面","bu":1,"note":""},{"n":"高斯投影","h":"拿一个椭圆柱「横着」套住地球，贴着中央子午线投影，再把圆柱展开成平面。","b":"椭圆柱横切参考椭球面的一条子午线（中央子午线），中心轴与长轴重合；中央子午线长度不变，越远变形越大。","k":"椭圆柱横切、中央子午线、等角投影","bu":0,"note":""},{"n":"UTM投影","h":"和高斯投影类似，但它是「割」不是「切」——两条经线无变形，中央经线略微缩短。","b":"等角横轴割圆柱投影，两条相割经线无变形，中央经线长度比0.9996。","k":"等角、横轴割圆柱、0.9996","bu":0,"note":""},{"n":"高斯投影特点","h":"①中央子午线不变形，越远变形越大；②其他子午线向中央子午线弯曲收敛于两极；③纬圈投影后仍是曲线、凹向两极。","b":"①中央子午线长度不变，越远变形越大；②其他子午线向中央子午线弯曲、收敛两极、对称；③纬圈投影后为对称曲线、与子午线投影垂直、凹向两极。","k":"中央不变形、越远越大、凹向两极","bu":1,"note":""},{"n":"投影带分带原则","h":"分带既要让变形够小，又要让带数别太多。","b":"既要使长度变形满足要求，又要使分带数不多。","k":"变形够小、带数不多","bu":1,"note":""},{"n":"6度带 / 3度带","h":"把地球按经度切成「带」，6°带/3°带，目的是控制长度变形。","b":"6°带从0°起每6°（我国第13~23带，L=6N-3°）；3°带从1.5°起每3°（我国第24~45带，L=3N）。","k":"6°带 L=6N-3°、3°带 L=3N","bu":0,"note":""},{"n":"国家统一坐标","h":"为了不让 y 坐标出现负数、并标出在哪一带，x 轴向西平移 500km、y 前面加带号。","b":"将x轴向西平移500km规避y负值；横坐标前加带号区别投影带。","k":"x西移500km、y前加带号","bu":0,"note":""},{"n":"高程 / 高差 / 相对高程","h":"高程＝地面点到大地水准面的铅垂距离（海拔）；高差＝两点高程之差；相对高程＝到假定水准面的距离。","b":"（绝对）高程＝地面点到大地水准面的铅垂距离；高差＝两点高程之差；相对高程＝到假定水准面的距离。","k":"高程→大地水准面、高差=两点差、相对高程→假定面","bu":0,"note":""},{"n":"确定高程基准目的","h":"统一全国高程起算面，让各地测的高程能对得上。","b":"统一高程起算面，保证测绘成果一致。","k":"统一起算面、成果一致","bu":1,"note":""},{"n":"验潮站 / 水准原点","h":"验潮站＝海边长期观测海水涨落、定平均海水面的站；水准原点＝青岛观象山的全国高程起点标石。","b":"验潮站观测潮汐升降、确定平均海水面；水准原点设青岛观象山，精密水准联测，是全国高程起算点。","k":"验潮站→平均海水面、水准原点→青岛观象山","bu":0,"note":""},{"n":"1956黄海高程系 / 1985国家高程基准","h":"两个「全国统一的海拔起算系统」，水准原点高程一个72.289m、一个72.260m。","b":"1956黄海＝1950-1956青岛验潮平均海水面起算，水准原点72.289m；1985国家＝1952-1979记录，72.260m。","k":"1956→72.289m、1985→72.260m","bu":0,"note":""},{"n":"方位角 / 三北方向","h":"方位角＝从「北」顺时针量到某直线的角度；三北＝真北（真子午线）、坐标北（x轴）、磁北（磁针）。","b":"方位角＝从基准方向顺时针量至直线的角；真北＝真子午线切线北端；坐标北＝高斯x轴正向；磁北＝磁针自由静止方向。","k":"顺时针、真北/坐标北/磁北","bu":0,"note":""},{"n":"真方位角 / 坐标方位角 / 磁方位角","h":"三种方位角＝分别从真北、坐标北、磁北起算的角度。","b":"真方位角从真北方向起算；坐标方位角从坐标北方向起算；磁方位角从磁北方向起算。","k":"真北/坐标北/磁北各起算","bu":1,"note":""},{"n":"子午收敛角 / 磁偏角","h":"都是「北和北之间的夹角」——子午收敛角＝真北和坐标北；磁偏角＝真北和磁北。","b":"子午收敛角＝真北与坐标北夹角；磁偏角＝真北与磁北夹角；从真北起算，东偏正西偏负。","k":"真北↔坐标北、真北↔磁北、东正西负","bu":0,"note":""},{"n":"磁坐偏角","h":"坐标北和磁北之间的夹角。","b":"坐标北方向与磁北方向的夹角。","k":"坐标北↔磁北","bu":1,"note":""},{"n":"水准面不平行性","h":"各个水准面互相不平行，因为重力不均匀，所以水准面是向两极收敛的曲面。","b":"由地球重力场分布不均导致，重力加速度随纬度和高度变化，使水准面成为向两极收敛的曲面。","k":"重力不均、向两极收敛、曲面","bu":0,"note":""},{"n":"地球曲率影响","h":"地球是圆的，量距离、角度、高程都要考虑弯曲误差——高程影响最大，距离最小。","b":"对距离 ΔS=S³/3R²；对水平角 ε=Pρ″/R²；对高程 Δh=S²/2R（短距离也必须考虑）。","k":"距离可忽略、高程必须考虑、Δh=S²/2R","bu":0,"note":""}]},{"name":"第4章 水准测量","items":[{"n":"水准测量","h":"用水准仪测两点高差、由已知高程推未知高程，是测高程的主要方法。","b":"测定地面点高程的主要方法之一，用水准仪和水准尺，据水平视线测两点高差，由已知高程推未知高程。","k":"水准仪+水准尺、测高差推高程","bu":1,"note":""},{"n":"水准测量原理","h":"用水准仪的水平视线，读后视 a、前视 b，高差 h=a−b，从已知高程推未知高程。","b":"水准仪提供水平视线，A 后视读数 a、B 前视读数 b，高差 hAB=a−b，HB=HA+hAB。","k":"h=a-b、后视-前视、HB=HA+h","bu":0,"note":""},{"n":"水准测量方法（转点）","h":"两点距离/高差太大时，中间设「转点」一站站传高程，各段高差相加。","b":"距离或高差过大时，设临时立尺点（转点）作高程传递点，选水准路线分段测，各段高差之和即两点高差。","k":"转点、分段传高程","bu":1,"note":""},{"n":"球气差","h":"地球弯曲 + 大气折光，两者合起来对水准读数造成的偏差。","b":"地球曲率和大气折光对一条水准尺的联合影响，r=[(1-K)S²]/2R；前后视距离相等可抵消。","k":"曲率+折光、r=(1-K)S²/2R","bu":0,"note":""},{"n":"水准仪（三部分）","h":"水准仪由望远镜、水准器、基座三部分组成。","b":"用于水准测量的仪器，由望远镜、水准器和基座三部分组成。","k":"望远镜、水准器、基座","bu":1,"note":""},{"n":"水准仪分类","h":"按「每千米往返测高差中数的偶然中误差」分级。","b":"根据每千米往返测的高差中数的偶然中误差划分种类。","k":"每千米往返测、偶然中误差","bu":1,"note":""},{"n":"望远镜构造","h":"由物镜、目镜、调焦透镜、十字丝分划板、调焦螺旋组成。","b":"由物镜、目镜、调焦透镜、十字丝分划板、物镜调焦螺旋、目镜调焦螺旋组成。","k":"物镜、目镜、调焦透镜、十字丝","bu":1,"note":""},{"n":"视准轴","h":"物镜光心与十字丝交点的连线（望远镜实际瞄准的方向）。","b":"物镜光心与十字丝交点的连线。","k":"物镜光心↔十字丝交点","bu":1,"note":""},{"n":"十字丝分划板","h":"玻璃板上刻三条横丝一条竖丝，中丝读数、上下丝测距。","b":"三条横丝一条竖丝；中间长横丝叫中丝（读数），上下丝用于测水准仪到水准尺的距离。","k":"中丝读数、上下丝测距","bu":1,"note":""},{"n":"视差及消除","h":"目标像和十字丝没重合，眼睛一动图像就相对动，这叫视差；转目镜、转物镜就消除。","b":"目标像与十字丝未重合时眼睛移动会看到相对位移；先转目镜使十字丝清晰，再转物镜使目标像清晰。","k":"像与十字丝不重合、先目镜后物镜","bu":0,"note":""},{"n":"水准器（水准管/圆水准器）","h":"水准管＝带气泡的管子，气泡居中说明水平（精平）；圆水准器＝圆形的，气泡居中做粗平。","b":"水准管——分划线与圆弧中心O对称，O为零点，过零点的纵向切线即水准管轴；圆水准器——顶面内壁为球面，中央圆圈圆心为圆水准器零点，零点与球心连线即圆水准轴。","k":"水准管（精平）、圆水准器（粗平）","bu":1,"note":""},{"n":"水准管轴 / 圆水准轴","h":"水准管轴＝过水准管零点的切线；圆水准轴＝圆水准器零点与球心的连线。","b":"水准管轴＝过水准管零点所作的圆弧纵向切线；圆水准轴＝圆水准器零点与球心的连线。","k":"水准管切线、圆水准器零点↔球心","bu":1,"note":""},{"n":"自动安平水准仪","h":"不用手动精平，圆水准器一对中，视线自动就是水平的。","b":"没有微倾螺旋和水准管，只要对中圆水准器，读数就是水平视线的读数。","k":"无微倾螺旋、对中圆水准器即水平","bu":0,"note":""},{"n":"水准仪的使用","h":"安置→粗平（圆水准器气泡居中）→瞄准→精平（水准管气泡居中）→读数。","b":"开三脚架、调脚螺旋使圆水准器气泡居中进行粗平；瞄准后转微倾螺旋使水准管气泡对中，精确水平后读数。","k":"粗平→瞄准→精平→读数","bu":1,"note":""},{"n":"电子水准仪","h":"给自动安平水准仪加了「光电探测 + 条码标尺」，能自动读数、自动记录。","b":"以自动安平水准仪为基础，加分光镜和光电探测器，配条码水准标尺；读数客观、速度快、精度高、可自动记录。","k":"光电探测+条码标尺、自动读数","bu":0,"note":""},{"n":"电子水准仪读数原理","h":"两种——相关法（条码图像与预设参考信息比对）、几何法（靠标尺刻划和几何光学自动读数）。","b":"①相关法——线阵探测器获得条码图像信号，与预设参考信息按相关方法比对，得读数和视距；②几何法——靠高质量标尺刻划和几何光学自动读数。","k":"相关法、几何法","bu":1,"note":""},{"n":"水准测量外业工作","h":"立后视尺→架仪→立前视尺→精平→读数→记录算高差，一站站往下搬。","b":"后视点立尺、架仪、前视点立尺；粗平精平后读后视、前视读数，记录并算高差；搬站时以上站前视点作下站后视点，重复至结束。","k":"后视→前视→读数算高差→搬站","bu":1,"note":""},{"n":"两次仪器高法 / 双面尺法","h":"两种「防止测错、互相校核」的测站方法。","b":"两次仪器高法＝两次不同仪器高度测高差；双面尺法＝黑面红面各读，遵循「后前前后，黑黑红红」。","k":"两法校核、后前前后黑黑红红","bu":0,"note":""},{"n":"i角误差","h":"视准轴和水准管轴没调平（竖直面差个 i 角），导致不同距离读数偏差不同。","b":"视准轴与水准管轴在竖直面的交角称 i 角，导致仪器在不同距离处读数偏差不同。","k":"视准轴≠水准管轴、i角","bu":0,"note":""},{"n":"交叉误差","h":"视准轴和水准管轴在水平面上的投影不平行，两者投影的交角叫交叉误差。","b":"视准轴与水准管轴在水平面上的投影的交角称交叉误差；仪器旋转轴不严格竖直会导致两轴水平投影不平行。","k":"两轴水平投影不平","bu":1,"note":""},{"n":"水准尺误差","h":"尺子刻得不准、尺长变了、弯了，都会带来误差；零点差靠「测站数取偶数」消除。","b":"水准尺刻画不准确、尺长变化、弯曲影响精度；零点差用偶数测站消除。","k":"刻画/尺长/弯曲、零点差偶数站","bu":1,"note":""},{"n":"观测误差（精平/调焦/估读/尺倾斜）","h":"人的操作误差有四类——精平、调焦、估读、水准尺倾斜。","b":"①精平误差②调焦误差③估读误差④水准尺倾斜误差（尺倾斜使读数偏大）。","k":"精平、调焦、估读、尺倾斜","bu":1,"note":""},{"n":"外界影响（下沉/折光/日照风力）","h":"环境带来的三类误差——仪器/尺下沉、大气折光、日照和风。","b":"①水准仪/水准尺下沉②大气垂直折光（视线高于地面0.3m减弱）③日照及风力（撑伞遮光）。","k":"下沉、大气折光、日照风力","bu":1,"note":""},{"n":"水准仪应满足条件","h":"主要两条——水准管轴平行视准轴、视准轴不随调焦变；次要两条——圆水准轴平行竖轴、横丝垂直竖轴。","b":"主要：①水准管轴∥视准轴②视准轴不随调焦改变位置；次要：③圆水准轴∥仪器旋转轴④横丝⊥仪器旋转轴。","k":"两条主要、两条次要","bu":1,"note":""},{"n":"i角检验","h":"检验视准轴和水准管轴「在竖直面里」是否平行。","b":"检验两轴在竖直方向上平行叫 i 角检验（水平方向平行叫交叉误差检验）。","k":"竖直面、i角","bu":1,"note":""},{"n":"水准尺检验","h":"测出水准尺每米的平均尺长，看和标称尺长差多少。","b":"水准尺每米平均尺长的测定，了解名义长度与真实尺长之差。","k":"每米平均尺长、名义vs真实","bu":1,"note":""},{"n":"水准测量三大误差来源","h":"误差分三类——仪器本身、人的观测、外界环境。","b":"①仪器误差（i角、交叉、尺误差）②观测误差（精平、调焦、估读、尺倾斜）③外界影响（下沉、折光、日照风力）。","k":"仪器误差、观测误差、外界环境影响","bu":0,"note":""}]},{"name":"第5章 角度测量","items":[{"n":"角度测量","h":"确定地面点位的基本测量工作之一，量的是水平角和竖直角，用的仪器是经纬仪。","b":"确定地面点位的基本测量工作之一，包括水平角测量和竖直角测量；常用仪器是经纬仪（游标经纬仪、光学经纬仪、电子经纬仪）。","k":"基本测量工作、水平角+竖直角、经纬仪","bu":1,"note":""},{"n":"水平角 / 竖直角 / 天顶距","h":"水平角＝两方向夹角在水平面上的投影；竖直角＝目标方向和水平方向的夹角；天顶距＝目标方向和「头顶」的夹角。","b":"水平角＝两直线夹角水平投影；竖直角＝竖直面内目标与水平方向夹角；天顶距＝目标与天顶方向夹角。","k":"水平投影、竖直面内、天顶方向","bu":0,"note":""},{"n":"水平角测量原理","h":"在过测站铅垂线的水平全圆量角器上，两个照准竖面各截出一个读数，相减就是水平角。","b":"设想在过测站 O 的铅垂线上水平放置一个按顺时针注记的全圆量角器；OA 竖面得读数 a、OC 竖面得读数 c，水平角 ∠AOC＝c−a。","k":"全圆量角器水平放置、两读数之差、c−a","bu":1,"note":""},{"n":"竖直角测量原理","h":"竖直角＝竖盘上两方向读数之差，其中一个是水平方向；视线水平时竖盘读数是定值（一般 90° 整数倍）。","b":"竖直角是竖直度盘上两方向读数之差，其中一个方向必是水平方向；任何注记形式的竖盘在视线水平时读数都是定值（一般为 90° 的整数倍），读出目标点竖盘读数即可求竖直角。","k":"竖盘读数之差、必含水平方向、视线水平读数=90°整数倍","bu":1,"note":""},{"n":"光学经纬仪","h":"用光学度盘、靠光学放大镜和光学测微器来读数的经纬仪。","b":"采用光学度盘，借助光学放大镜和光学测微器读数的一种经纬仪（常见 DJ07/DJ1/DJ2/DJ6/DJ30）。","k":"光学度盘、光学测微器、DJ系列","bu":1,"note":""},{"n":"经纬仪主要部件","h":"三大部分——望远镜（瞄准）、水准器（置平）、度盘（读数，分水平度盘和竖直度盘）。","b":"①望远镜（目镜、物镜、十字丝分划板、调焦透镜）；②水准器（水准管、圆水准器）；③水平度盘和竖直度盘（玻璃制成、边缘等间隔分划，相邻分划线间隔对应的圆心角叫度盘格值）。","k":"望远镜、水准器、水平/竖直度盘、度盘格值","bu":1,"note":""},{"n":"经纬仪轴线四关系","h":"经纬仪有四条轴线，它们之间的「垂直关系」规定了仪器对不对。","b":"①水准管轴⊥竖轴；②视准轴⊥横轴；③横轴⊥竖轴；④竖丝⊥横轴。","k":"四个「垂直」关系","bu":0,"note":""},{"n":"对中 / 整平目的","h":"对中＝让度盘中心对准测站点；整平＝让仪器水平。","b":"对中使水平度盘中心与测站点标志中心同一铅垂线；整平使竖轴竖直、水平度盘水平。","k":"对中→对准点位、整平→水平","bu":0,"note":""},{"n":"电子经纬仪","h":"用微处理机控制的电子测角系统代替光学读数系统，能自动显示测量数据的经纬仪。","b":"采用微处理机控制的电子测角系统代替光学读数系统，能自动显示测量数据。","k":"电子测角系统、自动显示","bu":1,"note":""},{"n":"电子测角读数系统","h":"电子经纬仪读角度的三种度盘系统——编码度盘、光栅度盘、条码度盘。","b":"包括编码度盘测角系统、光栅度盘测角系统、条码度盘测角系统。","k":"编码度盘、光栅度盘、条码度盘","bu":1,"note":""},{"n":"盘左盘右","h":"为消除仪器某些误差，用望远镜的两个位置各测一次——盘左叫正镜，盘右叫倒镜。","b":"为消除仪器某些误差，需用盘左、盘右两个位置观测；盘左（正镜）＝观测者对着目镜时竖盘在望远镜左边；盘右（倒镜）＝竖盘在望远镜右边。","k":"盘左=正镜、盘右=倒镜、消除误差","bu":1,"note":""},{"n":"测回法","h":"测两个方向之间夹角的方法——盘左测一次（上半测回）、盘右测一次（下半测回），取平均。","b":"在站点 B 测 BA 与 BC 的夹角：盘左瞄准左目标 A 读 a左，顺时针瞄准右目标 C 读 c左；盘右瞄准 C 读 c右，逆时针瞄准 A 读 a右，得 β左、β右。J6 仪器若 |β左−β右|≤40″，取 β=(β左+β右)/2 为一测回结果；可抵消部分仪器误差、检查有无错误。","k":"两个方向、上/下半测回、β=(β左+β右)/2、40″","bu":1,"note":""},{"n":"方向观测法","h":"一个测站要观测三个以上方向时用的方法，从起始方向开始依次观测各方向，最后回到起始方向「归零」。","b":"观测 O 到 A、B、C、D 各方向的水平角：盘左将度盘配置为 0°00′ 或稍大，从 A 开始依次观测 B、C、D 并记录；观测方向超过 3 个时要回到 A 读数（归零），以检查度盘在观测中是否变动；再盘右逆时针依次照准 A、D、C、B、A 读数。","k":"三方向以上、依次观测、归零、盘右逆序","bu":1,"note":""},{"n":"竖直角观测","h":"用竖盘读数算竖直角：视线水平时读数是定值，目标读数与之相减即得；盘左盘右取平均还能消指标差。","b":"视线上倾时，若竖盘读数增加，则 α＝瞄准目标读数−视线水平读数（盘右 α右＝R−270°）；若读数减少，则 α＝视线水平读数−瞄准目标读数（盘左 α左＝90°−L）；α＝[(R−L)−180°]/2。","k":"α=读数−水平读数、α左=90°−L、α=((R−L)−180°)/2","bu":1,"note":""},{"n":"中丝法","h":"测竖直角时用十字丝的中丝（横丝）切准目标同一部位，盘左盘右各读一次竖盘读数。","b":"中丝法测竖直角：①安置仪器、对中整平；②盘左瞄准目标，用中丝切目标于某一位置（照准标尺读中丝读数，或量取中丝所截位置至地面点的高度即目标高）；③转竖盘指标水准管微动螺旋使气泡居中，读竖盘读数 L；④盘右照准同一部位，重复②③读 R。","k":"中丝切目标、指标气泡居中、盘左盘右读L/R","bu":1,"note":""},{"n":"竖盘指标差","h":"竖盘指标没对准正确位置，导致视线水平时读数大了或小了 x，这个 x 就是竖盘指标差。","b":"因竖盘指标偏离正确位置，视线水平时竖直度盘读数大了或小了 x，称 x 为竖盘指标差；盘左 α左=90°−(L−x)、盘右 α右=(R−x)−270°，故 x=[(R+L)−360°]/2。","k":"指标偏离、x=[(R+L)−360°]/2","bu":1,"note":""},{"n":"竖盘指标自动归零装置","h":"仪器轻微倾斜时，它会自动调整光路，让读数等于水准管气泡居中时的正确读数，保证指标差为零。","b":"当经纬仪发生微小倾斜时，该装置自动调整光路，使读数为竖盘指标水准管气泡居中时的正确读数，保证指标差为零。","k":"自动调光路、指标差为零","bu":1,"note":""},{"n":"水平角观测误差","h":"误差来自仪器、对中/目标偏心、照准读数、外界环境几个方面。","b":"仪器误差（度盘偏心差、视准轴误差、横轴倾斜误差、竖轴倾斜误差）、仪器对中误差、目标偏心误差、照准误差与读数误差、外界环境影响。减弱：取盘左盘右读数平均可减弱度盘偏心、视准轴、横轴倾斜误差；严格对中整平可减弱竖轴倾斜与对中误差；多次观测取平均可减弱照准与读数误差；选好观测时间可减弱外界影响。","k":"度盘偏心、视准轴/横轴/竖轴误差、对中/目标偏心、照准读数、环境","bu":1,"note":""}]},{"name":"误差理论与测量平差基础（60%）","items":[{"n":"函数模型 / 数学模型","h":"函数模型＝观测量和未知量之间的数学关系式；数学模型＝用数学语言描述现实问题。","b":"函数模型是描述观测量与未知量的数学函数关系的模型；数学模型是通过数学语言对现实问题的抽象表达。","k":"观测量与未知量的关系、数学抽象","bu":0,"note":""},{"n":"误差","h":"误差＝观测值 − 真值（测得的值和真实值的差）。","b":"观测值与真值之差。","k":"观测值−真值","bu":0,"note":""},{"n":"测量平差","h":"用「最优准则」处理一堆带误差的观测数据，求出未知量的最佳值 + 精度。","b":"根据某种最优化准则，对带有观测误差的测量数据求定未知数的最优估值及精度；目的是提高精度、减弱偶然误差。","k":"最优准则、求最优估值、减弱误差","bu":0,"note":""},{"n":"评定精度指标","h":"评定精度的5个指标——中误差、相对误差、极限误差、或然误差、平均误差。","b":"中误差、相对误差、极限误差、或然误差、平均误差。","k":"五个指标","bu":0,"note":""},{"n":"必要观测数 / 多余观测数","h":"必要观测数＝确定模型最少要测几次；多余观测数＝总观测数 − 必要观测数。","b":"必要观测数＝确定几何/物理模型所必须的最少观测数；多余观测数＝观测值总数超出必要观测数的部分。","k":"最少观测、超出部分","bu":0,"note":""},{"n":"条件平差","h":"模型里有 r 个多余观测，就列 r 个条件方程来平差。","b":"一个模型有 r 个多余观测，产生 r 个条件方程，以条件方程为函数模型的平差方法。","k":"r个多余观测、r个条件方程","bu":0,"note":"【条件方程vs观测方程】条件方程（条件平差）＝解「改正数V」，不设参数，靠观测值之间的几何约束 A·V+W=0；观测方程（间接平差）＝解「参数X̂」（坐标/高程），把观测值表达成参数的函数 V=B·x̂−l。一个绕开参数，一个靠参数。"},{"n":"附有参数的条件平差","h":"在条件平差基础上，还选了几个参数（0<u<t）一起参与。","b":"n 个观测、t 个必要观测、r=n−t 个多余观测；又选 u 个独立量作参数（0<u<t），建立含参数的条件方程。","k":"条件方程 + 选参数u（0<u<t）","bu":0,"note":""},{"n":"间接平差","h":"选 t 个独立参数（等于必要观测数），把每个观测值表达成参数的函数（观测方程）来平差。","b":"所选独立参数个数等于必要观测数 t，把观测值表达成 t 个参数的函数，以观测方程为函数模型的平差方法。","k":"参数=t个、观测方程","bu":0,"note":"【观测方程vs条件方程】观测方程（间接平差）＝解「参数X̂」（坐标/高程），把每个观测值表达成参数的函数 V=B·x̂−l；条件方程（条件平差）＝解「改正数V」，不设参数，靠观测值几何约束 A·V+W=0。一个靠参数，一个绕开参数。"},{"n":"附有限制条件的间接平差","h":"间接平差时，如果选的参数比必要观测数多（u>t），这些参数之间就有 s=u−t 个限制条件，平差时既要列观测方程，又要列限制条件方程。","b":"参数 u>t 个（含 t 个独立参数），参数间存在 s=u−t 个限制条件；列出 n 个观测方程 + s 个限制条件方程作为函数模型。","k":"参数 u>t、s=u−t 个限制条件","bu":0,"note":""},{"n":"四种平差模型对比","h":"四种模型都基于最小二乘、用方差-协方差阵；区别在参数——条件平差不设参数，附参数条件平差和间接平差设参数，附限制条件间接平差的参数还有额外约束。","b":"相同点=都基于最小二乘、都用方差-协方差阵、都用于控制网/工程/变形监测；不同点=条件平差不设参数，间接平差/附参数条件平差设参数，附限制条件间接平差参数还有约束。","k":"都基于最小二乘；参数设不设","bu":0,"note":""},{"n":"相关平差","h":"考虑了观测值之间「相关」的一种平差（一般平差假设观测值独立）。","b":"考虑观测值之间存在相关性，建立数学模型，用最小二乘原理求参数的最或然值，提高精度。","k":"考虑相关性","bu":0,"note":""},{"n":"选权迭代法","h":"反复调整权值、迭代计算，逐步逼近最优解，主要用于处理粗差或精度差异大的情况。","b":"通过不断调整权值、反复迭代，使结果逐步趋近最优解；用于含粗差或精度差异大的情况。","k":"调权迭代、逼近最优、抗粗差","bu":0,"note":""},{"n":"点位中误差","h":"点位在两个垂直方向的方差之和（开方就是点位中误差）。","b":"两个垂直方向点位方差之和。","k":"两垂直方向方差之和","bu":0,"note":""},{"n":"点位真误差","h":"某点的真位置，和它平差后算出来的位置之间的距离。","b":"某点的真位置与其经过平差后得到的点位之间的距离。","k":"真位置与平差点的距离","bu":0,"note":""},{"n":"无偏性","h":"估计量的平均值（数学期望）等于被估参数的真实值，就叫无偏。","b":"估计量的数学期望等于被估计参数的真实值。","k":"期望=真值","bu":0,"note":""},{"n":"误差椭圆","h":"描述平面点位误差分布的椭圆，用长半轴、短半轴、方位角三个参数画出。","b":"描述平面点位误差分布的几何图形，通过长半轴、短半轴和方位角三个参数反映各方向精度差异。","k":"长半轴/短半轴/方位角、点位误差","bu":0,"note":""},{"n":"相对误差椭圆","h":"描述两个待定点之间「相对位置」精度的椭圆。","b":"描述两个待定点间相对位置精度的几何图形，通过长半轴、短半轴和方位角三要素反映两点相对位置的精度差异。","k":"两点相对位置、三要素","bu":0,"note":""},{"n":"任意方向位差","h":"在误差椭圆上，某个方向 ψ 的位差 = 从椭圆作该方向的正交切线，垂距 OD 的长度。","b":"自椭圆作 ψ 方向的正交切线 PD，P 为切点、D 为垂点，位差就是 OD 长度。","k":"正交切线、OD长度","bu":0,"note":""},{"n":"产生误差的原因","h":"误差来自三方面——观测者（人）、仪器、观测环境。","b":"观测者（感官局限：对中、整平、瞄准、读数误差）、仪器（本身精度有限）、观测环境（气温、湿度、大气折射率变化）。","k":"观测者、仪器、环境","bu":0,"note":""},{"n":"等精度/不等精度观测","h":"观测条件相同=等精度；观测条件不同=不等精度。","b":"等精度观测＝观测条件相同的同类观测；不等精度观测＝观测条件不同的同类观测。","k":"条件相同/不同","bu":0,"note":""},{"n":"误差分类","h":"误差分三类——偶然误差（乱）、系统误差（有规律）、粗差（大错）。","b":"偶然误差符号数值无规律；系统误差符号数值相同或有规律（周期/单向）；粗差超过限差。","k":"偶然、系统、粗差","bu":0,"note":""},{"n":"误差处理原则","h":"三类误差分别处理——粗差舍弃重测，偶然误差用规律处理，系统误差找原因改正/削弱。","b":"①粗差舍弃并重测；②有多余观测就有矛盾，按偶然误差规律处理得可靠数据；③系统误差按原因和规律改正、抵消或削弱。","k":"粗差舍、偶然处理、系统改正","bu":0,"note":""},{"n":"偶然误差四性","h":"偶然误差的四个特性——有界、集中、对称、抵消。","b":"①有界性②单峰性（集中性）③对称性④抵偿性。","k":"有界、单峰、对称、抵偿","bu":0,"note":""},{"n":"精度 / 准确度 / 精确度","h":"精度＝误差分布的密集离散程度；准确度＝真值和期望之差（描述系统误差）；精确度＝两者结合。","b":"精度＝误差分布的密度和离散程度；准确度＝观测值真值与数学期望之差；精确度＝精度和准确度的集成。","k":"精度=离散、准确度=期望与真值差、精确度=综合","bu":0,"note":""},{"n":"方差","h":"数据离均值差的平方的平均数。","b":"数据偏离其均值的差的平方的平均数，D=E[(X−E(X))²]。","k":"离均差平方平均、D=E[(X−E(X))²]","bu":0,"note":""},{"n":"中误差","h":"按有限次观测的偶然误差求得的标准差。","b":"按有限次观测的偶然误差求得的标准差。","k":"标准差、由偶然误差求得","bu":0,"note":""},{"n":"相对误差","h":"中误差和观测值的比值（用「1/T」表示）。","b":"中误差与观测值的比值。","k":"中误差/观测值、1/T","bu":0,"note":""},{"n":"极限误差","h":"中误差的 2 倍或 3 倍（超过就判为粗差）。","b":"两倍中误差或三倍中误差。","k":"2m 或 3m","bu":0,"note":""},{"n":"或然误差","h":"误差落在某个区间内的概率是 1/2，那个区间对应的值。","b":"误差出现在（−ρ，ρ）之间的概率为 1/2。","k":"概率1/2","bu":0,"note":""},{"n":"平均误差","h":"一组独立偶然误差「绝对值」的算术平均。","b":"一定观测条件下，一组独立偶然误差绝对值的期望算术平均值。","k":"绝对值平均","bu":0,"note":""},{"n":"算术平均值","h":"同一量测 n 次取平均，是最可靠值（最或然值）。","b":"同一条件下对某量观测 n 次，取其算术平均值作为最可靠数值。","k":"n次平均、最可靠值","bu":0,"note":""},{"n":"改正值","h":"算术平均值减去观测值（＝平均值 − 观测值）。","b":"观测值的算术平均值与观测值之差。","k":"平均值−观测值","bu":0,"note":""},{"n":"权（定义+特点）","h":"表示各观测值「可靠程度」之间比例关系的数——方差越小、权越大。","b":"权表示各观测值方差之间的比例关系，权之比等于方差倒数之比；特点：权大表示可靠、取正号、是相对值、可同乘同除、比例不变。","k":"方差的倒数之比、5特点","bu":0,"note":""},{"n":"白塞尔公式","h":"真值未知时，用「改正数」代替真误差求中误差的公式。","b":"真值未知时用改正数代替真误差求中误差：m=±√([vv]/(n−1))。","k":"改正数代替真误差、n−1","bu":0,"note":""},{"n":"误差传播定律","h":"描述「观测值中误差」和「观测值函数中误差」之间关系的式子。","b":"反映观测值中误差与观测值函数中误差之间关系的式子。","k":"函数中误差","bu":0,"note":""},{"n":"一般函数中误差","h":"误差传播定律在一般函数上的形式：中误差平方 = 各偏导平方 × 各观测值中误差平方之和。","b":"一般函数 Z=f(X) 的中误差平方 = Σ(∂f/∂xᵢ)²mᵢ²。","k":"偏导平方加权求和","bu":0,"note":""},{"n":"加权平均值","h":"带权的平均值，权大的观测值影响更大。","b":"加权平均值 x̄=[pL]/[p]，及其精度评定。","k":"[pL]/[p]","bu":0,"note":""}]},{"name":"距离测量","items":[{"n":"距离","h":"两点沿铅垂线方向在水平面上投影点之间的弧长。","b":"两点沿铅垂线方向在水平面上投影点间的弧长。","k":"铅垂投影、弧长","bu":0,"note":""},{"n":"水平距离/倾斜距离","h":"水平距离＝两点连线投影到水平面上的长度；倾斜距离＝不在同一水平面的两点间连线的长度。","b":"水平距离＝两点连线投影在水平面上的长度；倾斜距离＝不在同一水平面上的两点间连线的长度。","k":"投影到水平面、空间连线","bu":0,"note":""},{"n":"距离测量方法","h":"三种——钢尺测量、视距测量、光电测距。","b":"有钢尺测量、视距测量、光电测距。","k":"钢尺、视距、光电测距","bu":0,"note":""},{"n":"视距测距","h":"一种间接测距法——用望远镜十字丝上的视距丝和视距尺，靠光学几何关系算出两点距离。","b":"一种间接测距方法：利用十字丝分划板上的视距丝和刻有厘米分划的视距尺，按光学几何原理测定两点间水平距离；视线水平时 S=Kl，视线倾斜时 S=Kl·cos²α。优点：简单方便、不受地形限制；缺点：测距短、精度低。","k":"视距丝+视距尺、S=Kl、S=Klcos²α","bu":0,"note":""},{"n":"光电测距","h":"靠「光波往返时间 t × 光速 c」算距离，D=ct/2；操作简单、效率高、测程远。","b":"通过测定光波在待测两点间往返一次的时间 t 和光波在大气中的传播速度 c，测定两点间水平距离 D=(c·t)/2；操作简单、作业效率高、测程远；分脉冲式测距仪和相位式测距仪。","k":"D=ct/2、测时间、脉冲式/相位式","bu":0,"note":""},{"n":"脉冲式测距仪","h":"直接测光脉冲在测线上往返的时间 t，按 D=ct/2 算距离。","b":"通过测定光脉冲在测线上往返传播的时间 t，按 D=ct/2 求距离：发射光脉冲，仪器内取样棱镜取一小部分作主波脉冲（计时起点）；目标反射回来的光脉冲经接收器变为回波脉冲（计时终点）。","k":"光脉冲往返时间、D=ct/2、主波/回波脉冲","bu":0,"note":""},{"n":"相位式测距仪","h":"把光调制成高频信号，测往返产生的相位移 φ 算距离；靠粗/精两组频率解决整周数测不出的问题。","b":"光源经调制器成为光强随高频信号变化的调制光，射向反光镜后反射接收，由相位计比较发射与接收信号的相位移 φ=2π(N+Δφ/2π)，则 D=λ(N+ΔN)/2，N 为整周模糊度。因相位差只能确定不足一整周期的部分，需用至少两种频率：低频（粗测尺）定大数、高频（精测尺）定小数，一组测尺配合解决扩大测程与提高精度的矛盾及多值性问题。","k":"相位移 φ、整周模糊度 N、粗测尺/精测尺、两种频率","bu":0,"note":""},{"n":"光电测距误差","h":"总误差 mD = A + B·D——A 是固定误差，B 是比例误差，再加周期误差。","b":"mD = A + B·D，含固定误差 A、比例误差 B·D，以及周期误差。","k":"mD=A+BD","bu":0,"note":""},{"n":"固定/比例/周期误差","h":"固定误差与距离无关（测相、加常数），比例误差与距离成正比（光速、大气折射率、频率），周期误差按一定距离周期重复。","b":"固定误差＝与距离无关的误差（如测相误差、加常数误差）；比例误差＝与距离有关的误差（光速值误差、大气折射率误差、测距频率误差）；周期误差＝由仪器内部光电信号串扰引起的、按一定距离为周期重复出现的误差。","k":"固定=测相/加常数、比例=光速/折射率/频率、周期=信号串扰","bu":0,"note":""},{"n":"三大改正","h":"电磁波测距得到的只是初步距离，要化成水平距离得做三项改正——仪器系统误差改正、大气折射率改正、归算改正。","b":"为把测距的初步长度化算为两点间水平距离，需进行三项改正：①仪器系统误差的改正 ②大气折射率变化引起的改正 ③归算改正。","k":"仪器系统误差、大气折射、归算","bu":0,"note":""},{"n":"加常数/乘常数","h":"加常数＝与距离无关的固定偏差（仪器/反射镜起算中心不一致造成）；乘常数＝频率偏差造成的、与距离成正比的偏差。","b":"加常数：测距仪距离起算中心与安置中心不一致、反射镜等效反射面与安置中心不一致，使测得距离 D₀−d 与实际距离 D 之差，k=D−(D₀−d)，与所测距离无关；乘常数：实际调制光频率 f′ 与标准频率 f 不同引起的、与距离成正比的改正，R=Δf/f′（Δf=f′−f），乘常数改正 ΔDᴿ=−R·D′。","k":"加常数k=D−(D₀−d)、乘常数R=Δf/f′、与距离无关/成正比","bu":0,"note":""},{"n":"大气折射改正","h":"光速随大气条件变，实测大气状态和仪器设计状态不同，测尺长度就变了，要做气象改正。","b":"光的传播速度与大气条件有关，仪器制造时按某特定大气状态确定光波长，实测大气状态一般不同，使测尺长度改变，需进行大气改正：ΔDᵗᵖ＝[(279−0.29P)/(1−0.0037t)]·D′。","k":"气象改正、测尺长度变化、ΔD=[(279−0.29P)/(1−0.0037t)]D′","bu":0,"note":""},{"n":"归算改正","h":"倾斜距离要化成水平距离（倾斜改正），还要化算到大地水准面。","b":"包括倾斜改正和归算到大地水准面的改正：经加常数、乘常数、气象改正后得到的是倾斜距离，须归算为水平距离；测距时以水平面代替了大地水准面，须化算至大地水准面。","k":"倾斜改正、归算到大地水准面","bu":0,"note":""}]},{"name":"全站仪/三角高程/GNSS/RTK","items":[{"n":"全站仪","h":"全站型电子速测仪——集电子经纬仪、光电测距仪、微处理机于一体，照准后自动测距、测角、显示、储存。","b":"全站仪＝全站型电子速测仪的简称，集电子经纬仪、光电测距仪、微处理机于一体；基本功能是照准目标后，通过微处理机控制自动完成测距、水平方向和天顶距读数、观测数据的显示与储存等。","k":"电子经纬仪+光电测距仪+微处理机、自动测距测角显示储存","bu":0,"note":""},{"n":"自动全站仪","h":"能自动识别、照准、跟踪目标的全站仪。","b":"一种能自动识别、照准和跟踪目标的全站仪。","k":"自动识别、照准、跟踪","bu":0,"note":""},{"n":"三角高程测量","h":"用「竖直角 + 水平距离」算出测站与照准点之间的高差。","b":"根据由测站向照准点测出的竖直角和水平距离，计算出测站与照准点的高差。","k":"竖直角+水平距离、求高差","bu":0,"note":""},{"n":"三角高程测量原理","h":"在 A 架仪、B 立标尺，量仪器高 i、目标高 v，测竖直角 α，已知水平距离 D，则 h=Dtanα+i−v；用全站仪+棱镜则是 h=Ssinα+i−v。","b":"①在 A 架经纬仪、B 立标尺，量仪器高 i，用横丝对准标尺上距地面 v 的 M 点，测出 IM 与水平视线的竖直角 α，已知水平距离 D，则 hAB=D·tanα+i−v，HB=HA+hAB；②用全站仪+棱镜：量仪器高 i 和棱镜高 v，测斜距 S 和竖直角 α，hAB=S·sinα+i−v。","k":"h=Dtanα+i−v、h=Ssinα+i−v、仪器高i/目标高v","bu":0,"note":""},{"n":"三角高程基本公式","h":"单向观测 h=D₀tanα+C·D₀²+i−v（C 是球气差系数）；一般要求对向观测，取往返平均。","b":"单向观测基本公式 h12=D₀·tanα+C·D₀²+i−v（D₀ 为水平距离，C 为球气差系数）；一般要求对向观测（往返都测）：h12=S·tanα12+C12·S²+i1−v2，h21=S·tanα21+C21·S²+i2−v1，h对向=(D₀(tanα12−tanα21))/2+(i1+v1)/2−(i2+v2)/2。","k":"h=D₀tanα+CD₀²+i−v、对向观测、C球气差系数","bu":0,"note":""},{"n":"大气垂直折光系数K","h":"描述光线在大气层里因密度垂直变化而折射程度的量；中午前后最小最稳、日出日落最大，所以竖直角最好在当地 10–16 点测。","b":"描述光线在垂直平面内穿过地球大气层时，由于大气密度垂直变化而产生的折射程度的物理量；K 值中午前后最小也较稳定，日出、日落时最大且变化快，故竖直角观测时间最好在地方时 10 时至 16 时之间。","k":"大气密度垂直变化、折射程度、10–16时观测","bu":0,"note":""},{"n":"GNSS","h":"全球卫星导航系统——在地表到近地空间任何地方，全天候提供三维坐标、速度和时间信息的空基无线电导航定位系统。","b":"全球卫星导航系统（GNSS）：能在地球表面和近地空间任何地方，为用户提供全天候三维坐标、速度及时间信息的空基无线电导航定位系统；除美国 GPS 外，还有俄罗斯 GLONASS、中国北斗 BDS、欧洲 GALILEO。","k":"全天候三维坐标/速度/时间、GPS/GLONASS/BDS/GALILEO","bu":0,"note":""},{"n":"GPS(三部分)","h":"GPS 由空间部分（卫星）、地面监控部分（监测站+主控站+注入站）、用户部分（接收机）三部分组成。","b":"GPS＝全球定位系统，GNSS 中发展最成熟、应用最广；由空间部分、地面监控部分、用户部分组成。①空间部分＝GPS 卫星（收存导航信息、提供精密时间标准、发播导航电文）；②地面监控部分＝地面监测站+主控站+信息注入站（定轨、保持同一时间标准、监测卫星健康状态）；③用户部分＝GPS 接收机（主机+天线+电源，接收信号实现定位）。","k":"空间部分/地面监控部分/用户部分","bu":0,"note":""},{"n":"卫星定位基本原理","h":"把卫星当成一个「飞来飞去、但位置已知的点」，量出到它的距离，用空间后方交会算出你的位置。","b":"将卫星看做一个飞行的动态已知点，在其瞬时位置已知的情况下，以卫星和用户接收机天线相位中心的距离为观测量，进行空间位置后方交会，求出用户所在位置。","k":"动态已知点、空间后方交会、距离观测量","bu":0,"note":""},{"n":"GPS信号分类","h":"GPS 信号主要有载波（L1、L2）、测距码、导航电文，另有 P 码、Y 码。","b":"载波信号（L1 和 L2）、测距码、导航电文、Y 码、P 码。","k":"载波L1/L2、测距码、导航电文、P码/Y码","bu":0,"note":""},{"n":"卫星定位误差","h":"误差分三类——跟卫星有关、跟信号传播有关、跟接收机有关。","b":"①与卫星有关：星历误差、卫星钟误差；②与信号传播有关：电离层延迟误差、对流层延迟误差、多路径效应误差；③与接收机有关：观测误差、接收机钟误差、接收机天线相位中心偏移误差。","k":"星历/卫星钟、电离层/对流层/多路径、观测/接收机钟/天线相位中心","bu":0,"note":""},{"n":"静态/动态定位","h":"静态＝接收机不动，观测久、重复多、精度高（测板块运动、地壳形变）；动态＝接收机在动，能实时定位但精度低（飞机/船/车导航）。","b":"静态定位：定位时接收机天线位置固定不动，特点是观测时间长、有大量重复观测、结果可靠精度高，用于板块运动测定、地壳形变监测、大地测量及精密工程测量；动态定位：天线处于运动状态，能实时测得运动载体位置、多余观测少、精度较低，主要用于飞机、船只、车辆的导航。","k":"静止/观测久精度高、运动/实时精度低","bu":0,"note":""},{"n":"绝对/相对定位","h":"绝对定位＝单机、以地球质心为参照，独立定出点在 WGS-84 的绝对位置（简单但受多种误差影响）；相对定位＝两台以上接收机同时测同一组卫星，定相对位置/基线（靠求差削弱误差，精度高）。","b":"绝对定位：以地球质心为参照点，只需一台接收机，独立确定待测点在 WGS-84 中的绝对位置；组织简单但精度受多种误差影响，用于船/飞机导航、地质矿物勘探、建立浮标。相对定位：以地面某固定点为参照点，用两台以上接收机同时观测同一组卫星，确定各站的相对位置或基线向量；优点是误差对各站影响大体相同、可用求差法削弱或消除，缺点是内外业复杂，用于大地测量、精密定位。","k":"绝对=单机/地心/WGS-84、相对=多机/基线向量/求差","bu":0,"note":""},{"n":"RTK","h":"基于载波相位的实时高精度定位，靠无线电把基准站和流动站连起来做差分，能到厘米级。","b":"RTK＝基于载波相位观测值的实时高精度卫星定位技术，可达厘米级。核心原理：通过无线电通信系统连接基准站和流动站——基准站把伪距、载波相位观测值及自身信息（坐标、天线高等）传给流动站；流动站同时接收卫星信号和基准站数据，对两者载波信号做差分处理，实时求解基线向量；结合坐标转换和投影参数即得未知点实用坐标。特点：高精度、实时性、动态作业能力，但较依赖基准站、易受外界条件影响。","k":"载波相位、基准站+流动站、差分、厘米级","bu":0,"note":""}]},{"name":"控制测量/导线","items":[{"n":"测量工作原则","h":"测量要「先整体后局部、先控制后碎部」——先在测区建控制网，再从控制点去测周围碎部点。","b":"遵循「先整体后局部，先控制后碎部」的原则：先在测区内建立控制网，以控制网为基础，从各控制点开始测量周围的碎部点。原因：①防止误差积累、保证测量精度；②统一测量标准、避免成果矛盾。","k":"先整体后局部、先控制后碎部、防误差积累/统一标准","bu":0,"note":""},{"n":"控制测量","h":"在测区选一些控制点组成控制网（测区的骨架），对网进行布设、观测、计算，定出这些点在统一坐标系下的平面坐标和高程。","b":"在测量工作中，先在测区内选择一些控制点组成控制网形成测区的骨架，对控制网进行布设、观测、计算，确定控制点在统一坐标系下的平面坐标和高程的工作；包括平面控制测量和高程控制测量（另分图根控制测量、施工控制测量）。","k":"控制点组网、测区骨架、平面+高程控制测量","bu":0,"note":""},{"n":"平面控制测量","h":"确定控制点平面坐标的方法——导线测量、交会测量、天文观测、GPS 观测。","b":"包括：①导线测量（控制点连成折线即导线，观测边长和转折角，据起算数据算导线点平面坐标）②交会测量（据多个已知点、观测已知点与未知点间的方向和距离，推未知点平面坐标）③天文观测（控制地面大地网中方位误差的积累）④GPS 观测（观测空中多颗 GPS 卫星确定地面点三维坐标）。","k":"导线、交会、天文观测、GPS观测","bu":0,"note":""},{"n":"高程控制测量","h":"主要靠水准测量建立；地势起伏大、没法直接水准测量的地方，用三角高程测量建低精度的高程控制网和图根高程控制网。","b":"主要通过水准测量的方法建立；在地势起伏大、无法直接利用水准测量的地区，用三角高程测量的方法建立低精度的高程控制网以及图根高程控制网。","k":"水准测量为主、三角高程兜底、图根高程","bu":0,"note":""},{"n":"控制测量步骤","h":"五步——技术设计 → 实地选点 → 标石埋设 → 观测 → 数据处理。","b":"①技术设计（确定精度指标和控制网网形，采用「从整体到局部、分级布网、逐级控制」的布网程序）②实地选点（选能长期保存、点位稳定、便于观测处）③标石埋设 ④观测 ⑤数据处理（检验数据质量后平差计算）。","k":"技术设计→选点→埋石→观测→数据处理","bu":0,"note":""},{"n":"独立网/附合网","h":"独立网＝只有一套必要起算数据；附合网＝多于一套。","b":"独立网＝只有一套必要起算数据（三角网中已知一个点的坐标、一条边的边长和一边的坐标方位角）的控制网；附合网＝控制网中多于一套必要起算数据的控制网。","k":"独立=一套起算数据、附合=多于一套","bu":0,"note":""},{"n":"坐标方位角推算","h":"已知一条边的方位角 α1 和与下一条边的转折角 β，就能推出下一条边——左角加 β 减 180°，右角减 β 加 180°。","b":"左角时 α2＝α1+β−180°；右角时 α2＝α1−β+180°。","k":"左角 α2=α1+β−180°、右角 α2=α1−β+180°","bu":0,"note":""},{"n":"坐标正算/反算","h":"正算＝已知距离和方位角，算坐标增量得点坐标；反算＝已知两点坐标，算距离和方位角。","b":"正算：Δx=S·cosθ、Δy=S·sinθ，xB=xA+Δx、yB=yA+Δy；反算：αAB=arctan(ΔyAB/ΔxAB)，S=√(Δx²+Δy²)。","k":"正算 Δx=Scosθ/Δy=Ssinθ、反算 α=arctan(Δy/Δx)、S=√(Δx²+Δy²)","bu":0,"note":""},{"n":"导线测量优缺点","h":"优点是每点只需跟前后两点通视、精度均匀，适合隐蔽/城市/带状地区；缺点是误差累积、控制范围有限、依赖仪器。","b":"优点：每一点仅需与前后两点通视，精度均匀，适用于隐蔽地区、通视困难的城市以及带状区域的控制测量；缺点：误差累积、控制范围有限、对仪器依赖较强。","k":"前后两点通视/精度均匀、误差累积/范围有限","bu":0,"note":""},{"n":"导线布设","h":"单一导线三种——附合导线、闭合导线、支导线；导线网两种——附合导线网、自由导线网。","b":"单一导线可布设为附合导线、闭合导线、支导线；导线网可布设为自由导线网、附合导线网。附合导线：始于一个已知点、经若干未知点、终于另一已知点；闭合导线：始于一个已知点、经若干未知点、最终回到第一个已知点形成闭合多边形；支导线：既不符合于另一已知点、也不回到原控制点。","k":"附合/闭合/支导线、附合网/自由网","bu":0,"note":""},{"n":"导线观测","h":"两样——测转折角 + 测导线边。","b":"包括转折角的测量和导线边测量；转折角可用测回法，当导线点上要观测的方向大于三个时采用方向观测法；导线边可用电磁波测距，或用全站仪测角时同时测得导线边。","k":"转折角+导线边、测回法/方向观测法、电磁波测距","bu":0,"note":""},{"n":"导线平差方法","h":"分近似平差（低精度工程）和严密平差（规则导线网）；近似平差是先把角度闭合差分配掉，再分配坐标闭合差。","b":"分近似平差计算（用于精度较低工程测量）和严密平差计算（用于规则导线网）。近似平差的目的：获得各导线点的平面直角坐标；基本原理：将角度和边长误差分别平差——先进行角度闭合差的分配，在此基础上再进行坐标闭合差的分配。精度指标：坐标方位角闭合差、导线全长相对闭合差。","k":"近似/严密平差、先角度后坐标闭合差、方位角闭合差+全长相对闭合差","bu":0,"note":""},{"n":"坐标方位角闭合差/导线全长相对闭合差","h":"两个精度指标——方位角闭合差 fβ（推算出的方位角和已知的对不上差多少）；导线全长相对闭合差 k（坐标闭合差与导线总长的比值）。","b":"坐标方位角闭合差 fβ＝αBN′−αBN（由转折角推算的方位角与已知方位角之差）；导线全长相对闭合差 k＝fs/S总，fs＝√(fx²+fy²)（fx、fy 为坐标闭合差，S总 为导线全长）。限差：fβ容＝2mβ√(n+1)。","k":"fβ=α′−α、k=fs/S总、fs=√(fx²+fy²)","bu":0,"note":""},{"n":"支导线计算","h":"已知起始方位角，按左加右减推各边方位角，乘边长算坐标增量，逐个推点坐标。","b":"已知 MA 的坐标方位角，利用公式推导各边的坐标方位角，结合导线边长计算各相邻点的坐标增量，推算出各点坐标。（支导线无检核条件，只用于低精度或临时点。）","k":"推方位角→算坐标增量→推坐标、无检核","bu":0,"note":""},{"n":"附合导线计算","h":"从一个已知点测到另一个已知点，因误差最后算出的终点坐标和已知值对不上，产生坐标闭合差，按边长比例分配改正。","b":"①仅有一个连接角时：观测转折角结合已知方位角传递得终点 B 的坐标 (x′,y′)，与已知 (x,y) 不同，产生坐标闭合差 fx=x′−x、fy=y′−y，按相对距离分配改正数 vΔx=fx·Sij/S总、vΔy=fy·Sij/S总，得真实坐标。②具有两个连接角时：由 αMA 推算 αBN′，与已知 αBN 之差即方位角闭合差 fβ=αBN′−αBN；转折角等精度观测可直接分配，β 为左角时 vβi=−fβ/(n+1)，β 为右角时 vβi=fβ/(n+1)；精度指标为 fβ容＝2mβ√(n+1) 与导线全长相对闭合差 k。","k":"坐标闭合差fx/fy、按边长比例分配、两个连接角→fβ","bu":0,"note":""},{"n":"闭合导线计算","h":"从一点出发绕一圈回到原点，先看多边形内角和与理论值差多少（角度闭合差），改掉角度再算坐标闭合差。","b":"由于各种误差影响，导线多边形内角和与理论值不同，产生角度闭合差 fβ=[βi]−(n−2)·180°，改正数 vβ=−fβ/n；角度改正后的导线计算同上，坐标闭合差为角度改正后推算得到的坐标增量之和；精度指标为坐标方位角闭合差和导线全长相对闭合差。","k":"fβ=[βi]−(n−2)180°、vβ=−fβ/n","bu":0,"note":""},{"n":"交会测量","h":"不测导线，用已知点去「交」出未知点——前方交会、后方交会、测边交会、自由设站。","b":"包括：前方交会（在两个已知控制点上分别架仪观测与未知点的水平角 α、β，据已知点坐标和观测角算待定点坐标）；后方交会（在未知点上设站，向三个已知控制点观测水平角 α、β 计算待定点坐标）；测边交会（通过测量边长交会定点）；自由设站（未知点设站观测多个已知控制点的方向和距离，用间接平差确定坐标）。","k":"前方/后方/测边交会、自由设站","bu":0,"note":""},{"n":"水准路线(附合/闭合/支)","h":"单一水准路线三种——附合水准路线、闭合水准路线、支水准路线；多个单一路线连起来就是水准网。","b":"单一水准路线包括附合水准路线、闭合水准路线、支水准路线；水准网由多个单一水准路线相连构成，包括独立水准网和附合水准网。水准路线计算目的：检查外业观测成果质量、消除系统误差、对偶然误差进行平差处理、对观测成果和平差结果进行精度评定。","k":"附合/闭合/支水准路线、独立网/附合网","bu":0,"note":""},{"n":"水准网","h":"多条单一水准路线连在一起、构成网状的，就是水准网；分独立水准网和附合水准网。","b":"水准网由多个单一水准路线相连构成，包括独立水准网和附合水准网。","k":"多条水准路线相连、独立网/附合网","bu":0,"note":""},{"n":"跨河水准测量","h":"遇到江河、洼地、山谷这类过不去的障碍，为跨过去测水准而专门做的方法。","b":"跨越江河、洼地、山谷等障碍地段的水准测量。","k":"跨障碍、江河/洼地/山谷","bu":0,"note":""}]},{"name":"地形图/等高线","items":[{"n":"地图比例尺","h":"图上量的一段长度，和地面上对应实际长度的比值；有数字比例尺和图示比例尺两种。","b":"地图上任意一条线段与实际地面上相应线段的比值 d/D，包括数字比例尺和图示比例尺。","k":"d/D、数字比例尺/图示比例尺","bu":0,"note":""},{"n":"比例尺精度","h":"图上 0.1mm 对应地面上的实际距离；定了比例尺，就知道多大的地物要画、要测多准。","b":"相当于图上 0.1mm 的水平距离；当测图比例尺确定后，可以推算出多大的地物需要在地图上表示出来，以及测量地物要精确到什么程度。","k":"图上0.1mm、决定表示与精度","bu":0,"note":""},{"n":"地图","h":"按数学法则、用制图语言、经制图综合，把地球表面各种事物的空间分布、联系和发展变化画在一定载体上的图形。","b":"依据一定的数学法则，使用制图语言，通过制图综合，在一定载体上表达地球表面各种事物的空间分布、联系及时间中的发展变化状况的图形。","k":"数学法则+制图语言+制图综合、空间分布与变化","bu":0,"note":""},{"n":"普通地图","h":"综合、全面反映一定制图区域内自然要素和社会经济现象一般特征的地图。","b":"综合、全面地反映一定制图区域内自然要素和社会经济现象一般特征的地图。","k":"综合全面、自然+社会经济一般特征","bu":0,"note":""},{"n":"数字地图","h":"存在计算机里、能在屏幕上显示的地图（以地图数据库为基础，数字形式存储）。","b":"以地图数据库为基础，以数字形式存储在计算机外存储器上，并能在电子屏幕上显示的地图；能够快速读取、传输、动态读取。","k":"数据库+数字存储、电子屏显示、可快速传输","bu":0,"note":""},{"n":"地形(地物/地貌)","h":"地形＝地物＋地貌。地物是地面上固定的东西（路、房、铁路），地貌是地面起伏形状（高山、深谷、陡坎）。","b":"地形包括地物和地貌。地物＝地面上的各种固定事物（道路、房屋、铁路及其他人工建筑等）；地貌＝地球表面上各种起伏形状（高山、深谷、陡坎等）。","k":"地物=固定物体、地貌=起伏形状","bu":0,"note":""},{"n":"地形图","h":"按数学法则、用符号系统表示地物地貌平面位置和基本地理要素，高程用等高线表示的普通地图。","b":"按照一定的数学法则，运用符号系统表示地面上的地物、地貌平面位置及基本的地理要素，高程用等高线表示的普通地图；包括地图要素、地理要素、注记和整饰要素。","k":"符号系统、高程用等高线、地图/地理要素+注记+整饰","bu":0,"note":""},{"n":"线划图/影像图","h":"线划图＝用符号和线划表示地面点位置的地图（地形图、地籍图、房产图）；影像图＝线划图和影像平面图结合的形式。","b":"线划图＝将地面点的位置用符号与线划表示的地图（如地形图、地籍图、房产图）；影像图＝把线划图和影像平面图结合的一种形式（正射影像与线划符号综合表现在一张图面上）。","k":"符号+线划、影像与线划结合","bu":0,"note":""},{"n":"地形图图式","h":"图上用来表示实地地物和地貌的那套符号，统称地形图图式。","b":"实地的地物和地貌是用各种符号表示在图上的，这些符号总称为地形图图式。","k":"符号总称、表示地物地貌","bu":0,"note":""},{"n":"地物符号","h":"表示地物类别、形状、大小和位置的符号，分比例符号、半比例符号、非比例符号。","b":"表示地物的类别、形状、大小及其位置的符号，有比例符号、非比例符号和半比例符号。①比例符号＝按比例尺能把地物轮廓缩绘在图上（房屋、森林、湖泊）；②半比例符号＝长度能按比例缩绘、宽度无法缩绘（道路、河流、通信线）；③非比例符号＝轮廓较小或无轮廓但重要，不管尺寸直接表示（独立树、消防栓、井盖）。","k":"比例/半比例/非比例符号","bu":0,"note":""},{"n":"地貌符号/注记","h":"地貌用等高线法表示或绘注相应符号；注记分地名注记和说明注记。","b":"地貌符号——用等高线法表示或绘注相应的符号；注记——包括地名注记（行政区划、居民地、道路名称等）和说明注记（文字和数字注记）。","k":"等高线法+符号、地名/说明注记","bu":0,"note":""},{"n":"等高线","h":"地面上高程相同的点连成的闭合曲线；相当于用一组等高距相等的水平面去截地貌，截口曲线投影到水平面上形成的一圈套一圈的曲线。","b":"地面上高程相同的点连接形成的闭合曲线。原理：设想有一组高差间隔相等的水平面去截地貌，其截口必定是大小不同的闭合曲线，因山脊山谷形状不同呈不同弯曲；把这些曲线投影到水平面上，形成一圈套一圈的曲线即等高线。","k":"高程相同点连线、水平面截地貌、闭合曲线","bu":0,"note":""},{"n":"等高距","h":"相邻两条等高线的高程差；一定程度内等高距越小，地貌表示越真实。","b":"相邻等高线的高程差。在一定程度内，等高距越小表示地貌越真实；等高距越大显示地貌越粗略。","k":"相邻等高线高程差、越小越真实","bu":0,"note":""},{"n":"等高线平距","h":"图上相邻两条等高线之间的水平间距；同一幅图等高距相同时，平距大小直接反映坡度陡缓。","b":"地形图中相邻等高线间的水平间距。因同一地形图上等高距相同，故等高线平距的大小与地面坡度的陡缓有直接关系。","k":"相邻等高线水平间距、平距小=坡陡","bu":0,"note":""},{"n":"等高线分类","h":"四种——首曲线（按规定等高距）、计曲线（每四条首曲线加粗）、间曲线（1/2 等高距，长虚线）、助曲线（1/4 等高距，短虚线）。","b":"①首曲线＝按规定等高距描绘的等高线；②计曲线＝从高程为零处开始每隔四条首曲线加粗描绘；③间曲线＝按等高距一半、以长虚线描绘，用于起伏不大、坡度较缓、首曲线无法表示局部地貌的地区；④助曲线＝按等高距四分之一、用短虚线描绘，用于描绘首曲线和间曲线无法表示的重要地貌。","k":"首曲线/计曲线(每4条加粗)/间曲线(1/2长虚)/助曲线(1/4短虚)","bu":0,"note":""},{"n":"等高线特性","h":"四条——同线等高、闭合不相交（悬崖陡坡除外）、与分水线合水线正交、等高距相同时越密越陡。","b":"①同一条等高线上各位置高程相同；②等高线是闭合曲线，一般不相交、重合，只有悬崖、陡坡等处才可能相交重合；③等高线与分水线、合水线正交；④等高距相同时，等高线越密坡度越陡，越疏坡度越缓。","k":"同线等高、闭合不相交、与分/合水线正交、密陡疏缓","bu":0,"note":""},{"n":"地形图分幅编号","h":"把地形图按规定大小切成一块块并编号，方便画、管、用。","b":"目的：为了便于地形图的绘制、管理和使用，各比例尺地形图需要按照规定的大小进行分幅、编号。原则：明确界线、图幅均衡、编号系统。分幅方法：按经纬度分幅＝梯形分幅法，按平面直角坐标分幅＝矩阵分幅法；大比例尺用矩阵分幅，小比例尺用梯形分幅。矩阵分幅编号可按图廓西南角坐标、流水号、行列号，或以 1:5000 图为基础编号。","k":"明确界线/图幅均衡/编号系统、梯形(小比例尺)/矩阵(大比例尺)","bu":0,"note":""},{"n":"地物测绘原则","h":"能用比例尺画的按比例画，画不了的用符号标在中心；宽度画不了的就长度按比例、宽度用符号。","b":"①凡能用比例尺表示的地物，将其水平投影位置的几何形状按比例尺描绘在地形图上，或把边界表示在图上、边界内描绘相应符号；②凡不能用比例尺表示的地物，用相应的地物符号表示在地物中心；③凡长度能按比例尺表示而宽度不能表示的地物，将其长度用比例尺表示、宽度用相应地物符号表示。","k":"能比例尺→按比例、不能→符号标中心、长能宽不能→长比例宽符号","bu":0,"note":""},{"n":"特殊地貌","h":"山顶、山谷、山脊、山坡、盆地、鞍部、梯田这七种典型地貌。","b":"几种特殊地貌包括山顶、山谷、山脊、山坡、盆地、鞍部以及梯田。","k":"山顶/山谷/山脊/山坡/盆地/鞍部/梯田","bu":0,"note":""},{"n":"地貌特征线","h":"地表由许多不同方向、不同倾斜的曲面组成，两个相邻曲面之间的交线就是地貌特征线。","b":"地球表面形状可以看做由一些不同方向、不同倾斜面的不规则曲面构成，两相邻曲面之间的连线就是地貌特征线（如山脊线、山谷线）。","k":"相邻曲面交线、山脊线/山谷线","bu":0,"note":""}]},{"name":"碎部测量/数字化测图","items":[{"n":"碎部测量","h":"以控制点为基础，测量地物和地貌特征点的平面位置和高程，并画成地形图的工作。","b":"（第七章 碎部测量＝大比例尺地形图测量）以控制点为基础，测量地物和地貌特征点的平面位置和高程，并将其绘制成地形图的工作。过程包括测定这些特征点的平面坐标和高程，以及用地图符号在地形图上绘制各种地物和地貌。","k":"控制点为基础、测特征点平面位置+高程、绘制地形图","bu":0,"note":""},{"n":"碎部点","h":"碎部测量里用来表示地物平面形状的那些点——轮廓点和中心点。","b":"在碎部测量中，地物测绘实际上是地物平面形状的测绘，地物平面形状可以用其轮廓点和中心点表示，这些点就是碎部点。","k":"轮廓点、中心点、表示地物平面形状","bu":0,"note":""},{"n":"碎部点坐标计算(极坐标等)","h":"五种方法——极坐标法、方向交会法、量距法、直角坐标法、方向距离交会法。","b":"碎部点坐标计算方法有：极坐标法、方向交会法、量距法、直角坐标法、方向距离交会法。①极坐标法：在已知坐标的测站点架设仪器，定向后观测测站点到碎部点的方向、天顶距和斜距来计算碎部点坐标；②方向交会法：部分碎部点无法直接到达时，用方向交会计算；③量距法：因通视条件限制无法直接用全站仪观测时，利用周围已知点通过丈量距离计算。","k":"极坐标/方向交会/量距/直角坐标/方向距离交会","bu":0,"note":""},{"n":"碎部点高程计算","h":"用三角高程测量定高程；全站仪时 H=H₀+D·sinα+i−v，经纬仪/平板仪时 H=H₀+½kl·sin2α+i−v。","b":"①用普通三角高程测量或电磁波三角高程测量确定碎部点高程；②用经纬仪或平板仪测量时 H=H₀+½kl·sin2α+i−v；③用全站仪测量时 H=H₀+D·sinα+i−v。H₀ 为测站点高程，k 为视距乘常数，l 为尺间距，D 为到碎部点的斜距，α 为垂直角，i 为仪器高，v 为镜高。","k":"H=H₀+D·sinα+i−v、H=H₀+½kl·sin2α+i−v","bu":0,"note":""},{"n":"传统测图方法(平板/经纬仪)","h":"传统测图实质是图解法测图——仪器测出特征点位置，按比例尺用符号画到图上，再由人工描绘地物地貌。","b":"传统作图实质是图解法测图：利用测量仪器对地球表面局部区域的地物和地貌特征点的空间位置进行测量，按一定比例尺用地图符号在图上表示出来，而后由人工描绘地物和地貌。常用平板仪测图和经纬仪测图，步骤：①收集数据、实地踏勘、拟订计划；②基本控制测量和图根控制测量；③测图前准备；④测站点密度不够时加密；⑤逐点完成碎部测图；⑥图边测图和野外拼图；⑦检查和验收；⑧野外原图整饰和清绘。","k":"图解法、平板仪/经纬仪测图、8 步流程","bu":0,"note":""},{"n":"航空摄影测量","h":"在两地拍同一物体得到左右影像，用摄影测量仪器观测同名点，算出该点坐标。","b":"在两个不同的地方对一物体进行拍摄，得到左右影像，利用摄影测量仪器分别对左右影像上同一物体的同名点进行观测，得到该点坐标。分航空摄影、航测外业、航测内业三个阶段，内容包括航空摄影、影像处理、外业像控点测量、外业调绘、内业控制点加密、内业成图。","k":"左右影像、同名点、航空摄影/航测外业/航测内业","bu":0,"note":""},{"n":"地面数字测图","h":"用全站仪、GPS 接收机采集碎部点坐标和高程并编码，由计算机自动绘制成地形图。","b":"利用全站仪、GPS 接收机等仪器采集碎部点坐标和高程，并将其编码，通过计算机图形处理自动绘制成地形图的方法。特点：①精度较高；②自动化程度较高；③图根控制测量与碎部测量能同步进行；④直接得到碎部点平面坐标和高程，精度高；⑤分幅不受控制，可依特殊地物小组划分提高效率；⑥直接测量碎部点数目比图解测图增加，碎部点（尤其地形特征点）位置选择尤为重要；⑦需专门的数字地形图测图软件。","k":"全站仪/GPS+编码、计算机自动成图、精度高/同步/需专用软件","bu":0,"note":""},{"n":"数字地形图成图软件","h":"把野外采的碎部点数据在计算机上编辑成图的软件，功能分三块——数据预处理、地形图编辑、地形图输出。","b":"地形测量采集的碎部点数据，在计算机上经过人机交互编辑生成数字地形图。成图软件功能：①碎部数据的预处理（交互方式下碎部点坐标计算及编码、数据检查及修改、图形显示、图幅分幅）；②地形图的编辑（地物图形文件生成、等高线文件生成、图形修改、地形图注记、图廓生成）；③地形图的输出（地形图生成、数字地形图数据库处理及储存）。","k":"数据预处理、地形图编辑、地形图输出（三块）","bu":0,"note":""},{"n":"4D产品(DOM/DEM/DRG/DLG)","h":"现代测绘的四种数字成果——DOM 正射影像、DEM 高程模型、DRG 栅格地图、DLG 线划地图。","b":"4D 产品是现代测绘技术形成的数字地理信息成果，包括数字正射影像图（DOM）、数字高程模型（DEM）、数字栅格地图（DRG）、数字线划地图（DLG）。其中 DOM 是利用航空影像或卫星影像经几何校正生成的影像数据，具有可量测性和高精度信息特征，信息丰富直观，可用于地图修测更新、资源调查等。","k":"DOM/DEM/DRG/DLG、数字地理信息成果","bu":0,"note":""},{"n":"矢量数据/栅格数据","h":"地形图图形数据有两种表示法——矢量（用 x,y 坐标）和栅格（用像元）。","b":"地形图的图形数据形式有矢量数据形式和栅格数据形式：用矢量数据表示图形的地形图称为数字线划地形图（DLG），用栅格数据表示的称为数字栅格地形图（DRG）。矢量表示：点用一对坐标 (x,y)、线用一串有序坐标对、面用一串首尾相同的坐标对；栅格表示：点用中心点单个像元、线用中轴线上的像元集合（宽度仅一个像元）、面用其覆盖的像元。","k":"矢量=坐标对(DLG)、栅格=像元(DRG)","bu":0,"note":""},{"n":"大比例尺测图","h":"1:500～1:5000 的测图，包括地形图、地籍图、房产图、地下管线图。","b":"大比例尺测图指 1:500～1:5000 比例尺测图，包括地形图测绘、地籍图测绘、房产图测绘、地下管线图测绘。1:1万～1:5万比例尺测图一般采用航测法。大比例尺数字地形图测绘的方法：全站仪法、RTK 法、航空摄影测量法、机载激光雷达法。","k":"1:500~1:5000、四种图、全站仪/RTK/航测/激光雷达","bu":0,"note":""},{"n":"图根控制测量","h":"高级控制点太稀、不够测图用时，在它下面加密的图根点，供直接测图使用。","b":"测区内高级控制点密度不可能满足大比例尺测图要求，这时应适当增加图根控制点供直接测图使用；图根控制布设是在各级点的控制下加密，一般不超过两次闭合，在较小的独立测区内可采用图根控制测量作为首级控制。包括图根平面和高程控制测量：图根平面控制可用图根导线、GNSS RTK、边角交会；图根高程控制可用图根水准和电磁波测距三角高程。","k":"加密控制点、≤2次闭合、平面(导线/RTK/交会)+高程(水准/三角高程)","bu":0,"note":""},{"n":"地形图数据库","h":"地形图数据的集合；数据分空间数据、非空间数据、时间因素三类，用精确坐标描述，有明显空间特征。","b":"地形图数据库＝某一已知的地形图数据的集合，数据包括地形要素的空间数据和属性数据，特点是以精确的坐标来描述空间数据和属性数据，因此具有明显的空间特征。分类：①空间数据（位置、大小、形状、分布特征，含点/线/面/混合数据）②非空间数据（专题属性数据和质量描述数据）③时间因素（增加动态性质，要求及时获取、定期更新）。","k":"空间数据+属性数据、精确坐标、空间/非空间/时间","bu":0,"note":""}]},{"name":"地形图应用/DEM/3S","items":[{"n":"量取点坐标/距离/方位角","h":"在图上量点坐标——过点作平行 x、y 轴的线，量出到方格边的距离加上底角坐标；量距离和方位角就用两点坐标做坐标反算。","b":"①量取图上点的坐标：大比例尺地形图内图廓四角注有实地坐标 (X,Y)，在 P 点所在方格内过 P 作平行 x 轴和 y 轴的线 mn、ij，量取 pm、pi，则 XP=X+pm、YP=Y+pi。②量取两点间距离和坐标方位角：分别量取两点坐标，用坐标反算公式求距离和方位角；精度要求不高时可直接用比例尺量距离、用量角器量角度。","k":"XP=X+pm、坐标反算、精度低可比例尺/量角器","bu":0,"note":""},{"n":"确定高程与坡度","h":"点在等高线上就直接读高程；不在就用比例内插算出高程。坡度＝高差÷平距。","b":"确定点的高程：若 P 位于等高线上，P 点高程＝该等高线高程；若不在等高线上，过 P 作近似垂直等高线的线段 mn，量 mn 长 d 与 mp 长 d₁，则 H_P＝H_m＋d₁·h/d（H_m 为 m 点高程，h 为等高距）。确定坡度：求得两点水平距离和高差后，i＝tanα＝h/D，上坡为正、下坡为负。","k":"H_P=H_m+d₁h/d、i=tanα=h/D、上正下负","bu":0,"note":""},{"n":"绘制断面图","h":"沿指定方向 MN 连直线，找到它与各等高线的交点，以水平距离为横轴、高程为纵轴，逐点描出再连成光滑曲线。","b":"要沿 MN 方向绘制断面图：先连接 MN 直线，找到 MN 与等高线的交点 a、b、c…；在绘图纸上以 MN 为横轴表示水平距离、作 MN 的垂线为纵轴表示高程；量取各点的高程和水平距离，把各点坐标描绘出来，用光滑曲线连接，即得断面图。","k":"MN 与等高线交点、横轴水平距离/纵轴高程、光滑曲线","bu":0,"note":""},{"n":"确定汇水面积","h":"汇集水流的区域面积；边界由山脊线（分水线）连成，量这块面积就是汇水面积。","b":"汇集水流量的区域面积就是汇水面积。山脊线也称分水线，雨水、雪水以山脊线为界流向两侧，所以汇水面积的边界由山脊线连接而成，量出这一区域的面积就确定了汇水面积。","k":"山脊线=分水线、边界由山脊线连成","bu":0,"note":""},{"n":"面积/体积计算","h":"面积四种算法——几何图形法、网点法、求积仪法、坐标解析法；体积四种——等高线法、断面法、三角网法、方格法。","b":"面积计算：几何图形法、网点法、求积仪法、坐标解析法。体积计算：等高线法、断面法、三角网法、方格法。","k":"面积=几何/网点/求积仪/坐标解析；体积=等高线/断面/三角网/方格","bu":0,"note":""},{"n":"DEM数字高程模型","h":"用数字形式按一定结构组织、表示地形起伏的模型；便于存储更新和计算机处理，能算高程、面积、体积、坡度坡向、通视。","b":"DEM（数字高程模型）是以数字形式按一定结构组织在一起的、表示实际地形特征空间分布的模型，是定义在 x、y 域离散点上以高程表示地面起伏状态的数字集合。特点：便于存储、更新、传输和计算机自动处理；具有多比例尺特性；特别适合各种定量分析与三维建模。常用于计算单点高程、计算地表面积、计算体积、绘制剖面图、坡度和坡向计算、地形通视分析。","k":"离散点高程数字集合、多比例尺、定量分析/三维建模","bu":0,"note":""},{"n":"格网DEM","h":"DEM 最常见的形式——把区域划成规则的正方形格网，每个格子对应一个高程值。","b":"DEM 最常见的形式是高程矩阵（规则矩形格网），格网通常是正方形，把空间区域划分为规则的格网单元，每个格网单元对应一个二维数组和一个高程值，这种描述地面起伏状态的方法称为格网数字高程模型。生成方法：①将三角网转化为格网 DEM（按分辨率生成格网，对每个格网搜索最近的三角网点，用线性插值算格网点高程）；②等高线转换为格网 DEM（等高线离散化法、等高线直接内插法、等高线构建三角网法）。","k":"高程矩阵/规则正方形格网、一格一高程、三角网/等高线转换","bu":0,"note":""},{"n":"数字地面模型","h":"用数字形式表示地面特征空间分布的数据库，由一系列地面点坐标 (x,y,z) 和地表属性构成。","b":"数字地面模型，是一种以数字形式表示地面特征空间分布的数据库，通常由一系列地面点坐标 (x, y, z) 及地表属性（如目标类别、地形特征等）构成。","k":"点坐标(x,y,z)+地表属性、数字形式数据库","bu":0,"note":""},{"n":"3S技术","h":"遥感(RS)、地理信息系统(GIS)、全球定位系统(GPS)的统称。","b":"3S 技术是遥感、地理信息系统和全球定位系统的统称，是空间技术、传感器技术、全球定位及导航技术和计算机技术、通信技术相结合，多学科高度集成的对空间信息采集、处理、管理、分析、表示、传播和应用的现代信息技术。","k":"RS+GIS+GPS、采集/处理/管理/分析/表示/传播/应用","bu":0,"note":""},{"n":"无人机测绘系统","h":"五个子系统——无人机平台、地面控制、任务载荷、数据链路、影像处理与成果制作。","b":"无人机测绘系统包括无人机平台、地面控制子系统、任务载荷子系统、数据链路子系统，以及影像数据处理与测绘成果制作子系统。","k":"平台/地面控制/任务载荷/数据链路/数据处理","bu":0,"note":""},{"n":"测量平差发展","h":"平差因生产需要而生——1794 高斯提出最小二乘法，1860 勒戎德乐独立提出并命名；后来从偶然误差扩到系统误差和粗差，近年与 GPS/AI 融合。","b":"测量平差因生产需要产生：18 世纪末提出如何消除观测误差引起的观测值间矛盾、即从带误差观测值找未知量最佳估值的问题；1794 年高斯首先提出最小二乘法，1860 年勒戎德乐从代数观点独立提出并命名。发展：①从单纯研究偶然误差扩展到包含系统误差和粗差；②1947 年铁斯特拉提出相关观测值的平差理论（70 年代后广泛应用）；③经典最小二乘法所设参数为非随机变量；④近年与 GPS、遥感等新技术融合，AI 与大数据赋能平差软件，针对系统误差和粗差的创新算法涌现，并与计算机科学、统计学交叉。","k":"1794高斯最小二乘、1860勒戎德乐命名、1947铁斯特拉相关观测、偶然→系统误差+粗差","bu":0,"note":""},{"n":"测绘工程发展趋势","h":"从传统人工转向数字化、智能化、一体化——北斗/RTK/PPP、无人机航测/LiDAR、AI+BIM，应用扩展到新基建与智慧城市。","b":"测量工程依托新技术融合与多学科交叉，实现从传统人工模式向数字化、智能化、一体化的跨越式发展。①核心测绘技术持续迭代：北斗三号等实现厘米级高精度定位、与 GPS 兼容互操作，RTK、PPP 提升效率；无人机航测、高分辨率遥感及 LiDAR 广泛应用，高效完成实景三维建模与复杂地形数据采集。②地下惯性导航、盾构自动导向突破信号遮挡。③数据处理智能化：AI 与大数据赋能误差自动处理、变形趋势预测，BIM 与测量深度融合实现全生命周期数字化管控，国产化软件与云端平台推动数据共享。④应用拓展：服务新基建、智慧城市，自然资源监测、生态保护、应急测绘；装备向轻量化、自动化演进。","k":"数字化/智能化/一体化、北斗+RTK+PPP、无人机+LiDAR、AI+BIM、新基建/智慧城市","bu":0,"note":""}]}],"schedule":[{"d":1,"date":"9.26","nw":["广义数字化测图","空间信息可视化","城市基础地理信息系统","大地体","地球总椭球","参考椭球面"],"rv":[]},{"d":2,"date":"9.27","nw":["赤道面/赤道","平面直角坐标系(三分类)","独立平面直角坐标系","建筑施工坐标系","1954北京坐标系","1980国家坐标系"],"rv":["广义数字化测图","空间信息可视化","城市基础地理信息系统","大地体","地球总椭球","参考椭球面"]},{"d":3,"date":"9.28","nw":["2000国家/WGS-84坐标系","地图投影","投影变形","地图投影分类","距离改化/方向改化","高斯投影特点"],"rv":["赤道面/赤道","平面直角坐标系(三分类)","独立平面直角坐标系","建筑施工坐标系","1954北京坐标系", <script>
(function(){
"use strict";
var D=DATA,S=D.schedule;
var IMAP={},NMAP={};
D.chapters.forEach(function(c){c.items.forEach(function(it){
  IMAP[it.n]=it; NMAP[norm(it.n)]=it; });});
function norm(s){return String(s==null?'':s).replace(/（/g,'(').replace(/）/g,')')
  .replace(/／/g,'/').replace(/\s+/g,'');}
function find(n){return IMAP[n]||NMAP[norm(n)]||null;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

var KEY='bs_done_v1',done={};
try{done=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){done={};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done));}catch(e){}}
function tk(d,t,n){return d+'|'+t+'|'+n;}
function isDone(k){return !!done[k];}

function todayDay(){
  var b=new Date(D.meta.base+'T00:00:00'),n=new Date();
  n.setHours(0,0,0,0);
  var d=Math.floor((n-b)/864e5)+1;
  return Math.min(Math.max(d,1),S.length);
}
var TODAY=todayDay();
// 最新「已生成」的一天：新记忆全部能查到答案
var LAST_READY=(function(){var last=1;
  for(var i=1;i<=S.length;i++){var s=S[i-1];
    if(s.nw.length && s.nw.every(function(n){return !!find(n);})) last=i;}
  return last;})();
var curDay=Math.min(TODAY,LAST_READY),tab='today',q='';

function dayItems(d){
  var s=S[d-1],out=[];
  s.nw.forEach(function(n){out.push([d,'new',n]);});
  s.rv.forEach(function(n){out.push([d,'rev',n]);});
  return out;
}
function stats(d){
  var all=dayItems(d),c=0;
  all.forEach(function(a){if(isDone(tk(a[0],a[1],a[2])))c++;});
  return {total:all.length,done:c};
}
function paintBar(){
  var st=stats(curDay),p=st.total?Math.round(st.done/st.total*100):0;
  document.getElementById('barFill').style.width=p+'%';
  document.getElementById('hProg').textContent='已背 '+st.done+' / '+st.total+' 项';
}

function cardHTML(day,type,name){
  var it=find(name),k=tk(day,type,name),on=isDone(k);
  var lvl=(type==='new'||on)?'all':'';          // 新记忆默认全部展开；复习默认收起
  var cls='item'+(on?' on':'')+(lvl?' open':'')+(lvl==='kw'?' kwonly':'');
  var det;
  if(it){
    det='<div class="det">'
      +'<p class="p-human"><span class="lb">人话</span>'+esc(it.h)+'</p>'
      +'<p class="p-book"><span class="lb">课本要点</span>'+esc(it.b)+'</p>'
      +'<p class="p-kw"><span class="lb">关键词</span><span class="kwbox">'+esc(it.k)+'</span></p>'
      +(it.note?'<p class="nt"><span class="lb">补充</span>'+esc(it.note)+'</p>':'')
      +'</div>';
  }else{
    det='<div class="det"><p class="miss">（该项暂未收录答案，可在 _mem_data.py 补录）</p></div>';
  }
  var bu=(it&&it.bu)?'<i class="bu">补漏</i>':'';
  return '<div class="'+cls+'" data-k="'+esc(k)+'">'
    +'<button class="chk" aria-label="标记已背"></button>'
    +'<div class="bd"><div class="nm">'+esc(name)+bu+'</div>'+det+'</div>'
    +'<div class="acts">'
    +'<button data-lv="kw" class="'+(lvl==='kw'?'on':'')+'" aria-label="只看关键词">词</button>'
    +'<button data-lv="all" class="'+(lvl==='all'?'on':'')+'" aria-label="全部展开">全</button>'
    +'</div></div>';
}

function viewToday(){
  var s=S[curDay-1],h='';
  h+='<h2>🆕 新记忆（'+s.nw.length+' 项）</h2>';
  h+=s.nw.length?s.nw.map(function(n){return cardHTML(curDay,'new',n);}).join(''):'<div class="empty">今天没有新记忆</div>';
  h+='<h2>🔁 复习（'+s.rv.length+' 项）</h2>';
  h+=s.rv.length?s.rv.map(function(n){return cardHTML(curDay,'rev',n);}).join(''):'<div class="empty">今天没有复习</div>';
  return h;
}

function viewList(){
  var h='<input class="search" id="q" placeholder="搜索知识点 / 关键词…" value="'+esc(q)+'">';
  D.chapters.forEach(function(c,ci){
    var inner=c.items.map(function(it){
      var kw=it.k?('<span class="kw">'+esc(it.k)+'</span>'):'';
      var bu=it.bu?'<i class="bu">补漏</i>':'';
      return '<div class="li" data-s="'+esc((it.n+' '+it.k+' '+it.h).toLowerCase())+'">'
        +'<b>'+esc(it.n)+'</b>'+bu+kw+'</div>';
    }).join('');
    h+='<details class="chap"'+(ci<2?' open':'')+'><summary>'+esc(c.name)
      +'（'+c.items.length+'）</summary><div>'+inner+'</div></details>';
  });
  return h;
}

function viewSched(){
  var h='<table><thead><tr><th>天</th><th>日期</th><th>新</th><th>复习</th><th>合计</th></tr></thead><tbody>';
  S.forEach(function(r){
    var cls=(r.d===TODAY)?' class="today"':'';
    h+='<tr'+cls+' data-d="'+r.d+'"><td>第'+r.d+'天</td><td>'+esc(r.date)+'</td>'
      +'<td>'+r.nw.length+'</td><td>'+r.rv.length+'</td>'
      +'<td>'+(r.nw.length+r.rv.length)+'</td></tr>';
  });
  return h+'</tbody></table>';
}

function render(){
  var s=S[curDay-1];
  document.getElementById('hDay').textContent='第 '+curDay+' 天';
  document.getElementById('hDate').textContent=esc(s.date)+(curDay===TODAY?' · 今天':'');
  paintBar();
  var hint=document.getElementById('hint');
  if(TODAY>LAST_READY){
    hint.className='hint on';
    hint.textContent='今天（第 '+TODAY+' 天，'+esc(S[TODAY-1].date)+'）的内容还没生成，已为你显示最新的第 '+LAST_READY+' 天。';
  }else{hint.className='hint';hint.textContent='';}
  var v=document.getElementById('view');
  v.innerHTML=tab==='today'?viewToday():(tab==='list'?viewList():viewSched());
  if(tab==='list')wireSearch();
}

function wireSearch(){
  var box=document.getElementById('q');
  if(!box)return;
  var lis=v_all('.li');
  function apply(){
    q=box.value;var t=q.trim().toLowerCase();
    lis.forEach(function(el){
      el.classList.toggle('hide', !!t && (el.getAttribute('data-s')||'').indexOf(t)<0);
    });
  }
  box.addEventListener('input',apply);
  apply();
}
function v_all(sel){return Array.prototype.slice.call(document.querySelectorAll(sel));}

function syncActs(item){
  var open=item.classList.contains('open'),kw=item.classList.contains('kwonly');
  var bs=item.querySelectorAll('.acts button');
  for(var i=0;i<bs.length;i++){
    var lv=bs[i].getAttribute('data-lv');
    bs[i].classList.toggle('on',open&&((lv==='kw'&&kw)||(lv==='all'&&!kw)));
  }
}
function setLevel(item,lv){
  var open=item.classList.contains('open');
  var cur=item.classList.contains('kwonly')?'kw':'all';
  if(open&&cur===lv){item.classList.remove('open','kwonly');}
  else{item.classList.add('open');item.classList.toggle('kwonly',lv==='kw');}
  syncActs(item);
}

document.addEventListener('click',function(e){
  var chk=e.target.closest('.chk');
  if(chk){
    var item=chk.closest('.item'),k=item.getAttribute('data-k');
    if(done[k]){delete done[k];item.classList.remove('on');}
    else{done[k]=1;item.classList.add('on');}
    save();paintBar();return;
  }
  var ab=e.target.closest('.acts button');
  if(ab){setLevel(ab.closest('.item'),ab.getAttribute('data-lv'));return;}
  var bd=e.target.closest('.bd');
  if(bd){
    var it=bd.closest('.item');
    if(it.classList.contains('open')){it.classList.remove('open','kwonly');}
    else{it.classList.add('open');it.classList.remove('kwonly');}
    syncActs(it);return;
  }
  var tr=e.target.closest('tr[data-d]');
  if(tr){curDay=parseInt(tr.getAttribute('data-d'),10);tab='today';syncNav();render();window.scrollTo(0,0);return;}
  var nb=e.target.closest('nav button');
  if(nb){tab=nb.getAttribute('data-tab');syncNav();render();window.scrollTo(0,0);return;}
});
function syncNav(){
  v_all('nav button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')===tab);});
}
document.getElementById('prev').addEventListener('click',function(){
  if(curDay>1){curDay--;render();window.scrollTo(0,0);}
});
document.getElementById('next').addEventListener('click',function(){
  if(curDay<S.length){curDay++;render();window.scrollTo(0,0);}
});
document.getElementById('goToday').addEventListener('click',function(){
  TODAY=todayDay();curDay=Math.min(TODAY,LAST_READY);tab='today';syncNav();render();window.scrollTo(0,0);
});
document.getElementById('foot').textContent =
  '已收录 ' + D.meta.total + ' / ' + D.meta.goal + ' 项 · 共 '
  + D.chapters.length + ' 章 · 排期 ' + S.length + ' 天'
  + (D.meta.doneAll ? ' · 整轮已背完 ✅' : '');
render();
})();
</script>
</body>
</html>
